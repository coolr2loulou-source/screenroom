<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screenroom</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://api.themoviedb.org">
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://vidy.st">
<link rel="preconnect" href="https://vidsrc.to">
<link rel="preconnect" href="https://multiembed.mov">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#141922">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Screenroom">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#141922;--surface:#1e2532;--line:#2c3547;--text:#ece9e2;--muted:#8d97a8;--accent:#ff7a45;--radius:8px;--bg-opacity:0.25}
body.light{--bg:#f4f6f9;--surface:#ffffff;--line:#d0d7de;--text:#1f2328;--muted:#57606a}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .3s,color .3s}

header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg,#141922);z-index:10;-webkit-transform:translateZ(0);transform:translateZ(0)}
body.light header{background:rgba(244,246,249,0.85)}

.logo{font:700 22px Georgia,serif;cursor:pointer;white-space:nowrap;flex-shrink:0}
.logo span{color:var(--accent)}

.search-wrap{flex:1 1 180px;min-width:0;max-width:480px;position:relative}
#q{width:100%;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:16px;-webkit-appearance:none}
.search-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:6px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:20;display:none;max-height:240px;overflow-y:auto}
.search-dropdown.open{display:block}
.sdrop-item{padding:8px 14px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.sdrop-item:hover{background:var(--line)}

#back{display:none;padding:8px 12px;flex-shrink:0;font-weight:700;border-radius:999px;line-height:1}
#hdr-dice{padding:6px 12px;font-size:18px;border-radius:999px;flex-shrink:0}

nav{display:flex;gap:6px}
nav button{border-color:transparent;background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;cursor:pointer}
nav button.on{color:var(--text);background:var(--surface);border:1px solid var(--line)}
#q:focus,button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));max-width:1600px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}

.card{background:var(--surface);border-radius:var(--radius);overflow:hidden;cursor:pointer;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.25);position:relative;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 6px 20px rgba(255,122,69,0.3)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222a39}
.card div{padding:8px 10px;font-size:14px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.card small{color:var(--muted);display:block}
.card .prog{height:3px;padding:0;background:var(--line)}
.x{position:absolute;top:6px;right:6px;width:30px;height:30px;padding:0;border-radius:50%;background:rgba(20,25,34,.85);color:#fff;font-size:18px;line-height:1;border:0;cursor:pointer}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filters select,.filters input{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;min-width:0}
.filters input{width:100px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.sim{margin-top:24px}

.sk{background:var(--surface);border-radius:var(--radius);aspect-ratio:2/3;animation:pulse 1.2s ease-in-out infinite}
.player.sk{aspect-ratio:16/9;border-radius:10px;background:var(--surface)}
@keyframes pulse{0%{opacity:.3}50%{opacity:.7}100%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

.quote-splash{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius);padding:14px 18px;margin-bottom:20px;font-style:italic;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.quote-splash span{font-style:normal;font-weight:600;font-size:12px;color:var(--accent);margin-left:10px;white-space:nowrap}

.empty{text-align:center;padding:48px 0}
.empty i{display:block;width:64px;height:92px;margin:0 auto 16px;border:2px dashed var(--line);border-radius:8px}
.hint{display:none;text-align:center;color:var(--muted);font-size:13px;padding:0 0 24px}
@media (hover:hover) and (pointer:fine){.hint{display:block}}
.upd{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--accent);color:#141922;font-weight:600;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;text-align:center}
.upd button{background:#141922;color:var(--text);border:0}
.nextup{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.nextup span{flex:1 1 160px}
.rt{position:absolute;top:6px;left:6px;background:rgba(20,25,34,.85);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
#lang{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;margin:0 0 12px}
.attr{text-align:center;color:var(--muted);font-size:12px;padding:0 20px calc(24px + env(safe-area-inset-bottom))}
.bk{display:flex;gap:10px;flex-wrap:wrap}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hd h2{margin:0;display:flex;align-items:center;gap:10px}
.hd h2::before{content:"";width:4px;height:1em;background:var(--accent);border-radius:2px;flex:none}
#fav.on{color:var(--accent);border-color:var(--accent)}
.prog i{display:block;height:100%;background:var(--accent)}
.msg{color:var(--muted);padding:40px 0;text-align:center}
.player{aspect-ratio:16/9;width:100%;background:#000;border-radius:10px;overflow:hidden;position:relative}
.player iframe{width:100%;height:100%;border:0}
button{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:15px;cursor:pointer;transition:border-color .15s}
button:hover{border-color:var(--accent)}
h2{margin:18px 0 6px;font:700 26px Georgia,serif}
h2.sec{margin:0 0 12px;font-size:21px}
.row{margin-bottom:28px}
.meta{color:var(--muted);margin:0 0 10px}
.ep{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
.setup{max-width:480px;margin:60px auto;text-align:center}
.setup input{width:100%;padding:12px;margin:14px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text)}

@media (max-width:600px){
  header{flex-wrap:nowrap;gap:8px;padding:calc(max(env(safe-area-inset-top), 50px) + 6px) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left))}
  .logo{font-size:18px}
  #back{padding:7px 10px;font-size:15px}
  .search-wrap{flex:1 1 auto;min-width:0}
  #q{padding:8px 12px;font-size:16px}
  #hdr-dice{padding:6px 10px;font-size:16px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:40;order:0;width:100%;gap:0;background:var(--bg,#141922);border-top:1px solid var(--line);-webkit-transform:translateZ(0);transform:translateZ(0);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  body.light nav{background:#f4f6f9}
  nav button{flex:1;border:0;border-radius:10px;padding:9px 2px;font-size:12px;color:var(--muted);white-space:nowrap}
  nav button.on{background:transparent;color:var(--accent);font-weight:700}
  main{padding:14px max(12px,env(safe-area-inset-right)) calc(86px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  .attr{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
  .hero{min-height:210px}
  .hero-in{padding:18px}
  .hero h1{font-size:24px}
  .hero p{font-size:14px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  #totop{bottom:calc(74px + env(safe-area-inset-bottom));right:14px;padding:8px 14px;font-size:13px}
}
body.theater nav{display:none}

.hero{position:relative;border-radius:14px;overflow:hidden;background-size:cover;background-position:center 20%;min-height:240px;display:flex;align-items:flex-end;margin-bottom:28px;border:1px solid var(--line)}
.hero-in{padding:28px;max-width:640px}
.hero h1{margin:6px 0 8px;font:700 clamp(26px,4vw,44px)/1.1 Georgia,serif}
.hero p{margin:0 0 16px;color:#d6d3cc}
.hero button{margin-right:8px}
.hero .primary{background:var(--accent);color:#141922;border-color:var(--accent);font-weight:700}
@media (min-width:900px){.hero{min-height:380px}.hero-in{padding:40px}}
.railwrap{position:relative}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:10px;scrollbar-width:thin}
.rail .card{flex:0 0 140px;scroll-snap-align:start}
@media (min-width:900px){.rail .card{flex-basis:185px}}
.arr{position:absolute;top:32%;z-index:3;width:40px;height:56px;padding:0;font-size:28px;line-height:1;background:rgba(20,25,34,.85);color:#fff;opacity:0;transition:opacity .2s;border:0;cursor:pointer}
.arr.l{left:-6px}.arr.r{right:-6px}
@media (hover:hover){.railwrap:hover .arr{opacity:.95}}
@media (hover:none){.arr{display:none}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}

.cast-rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.ccard{flex:0 0 100px;text-align:center;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;padding-bottom:8px}
.ccard img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#222a39;margin-bottom:6px}
.ccard b{display:block;font-size:13px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard small{display:block;font-size:11px;color:var(--muted);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.player-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.player-bar select,.player-bar button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;transition:border-color .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}

.badge-tag{background:rgba(255,122,69,0.15);color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;display:inline-block;margin-right:8px}

.stats-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:20px}
.stat-item{text-align:center}
.stat-num{font-size:22px;font-weight:700;color:var(--accent)}
.stat-lbl{font-size:11px;color:var(--muted)}

.theme-opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.tcolor{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.slider-group{display:flex;flex-direction:column;gap:6px;max-width:320px;margin:12px 0}

.seasons{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;margin-bottom:18px}
.scard{flex:0 0 140px;position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:var(--surface)}
.scard img,.scard .noimg{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222a39}
.scard.sel{outline:2px solid var(--text);outline-offset:-2px}
.scard.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cbadge{display:none;position:absolute;top:8px;right:8px;z-index:2;background:var(--accent);color:#141922;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
.scard.cur .cbadge{display:block}
.sinfo{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;background:linear-gradient(0deg,rgba(0,0,0,.88),transparent);display:flex;flex-direction:column;font-size:12px;color:#ddd}
.sinfo b{font-size:14px;color:#fff}
@media (min-width:900px){.seasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));overflow:visible}.scard{flex:none}}
.eplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:28px}
.epc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.epc:hover{border-color:var(--accent)}
.epc.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.epc.soon{opacity:.7;cursor:default}
.still{position:relative;aspect-ratio:16/9;background:#222a39}
.still img{width:100%;height:100%;object-fit:cover;display:block}
.bdg{position:absolute;top:8px;left:8px;font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;color:#fff}
.bdg.ok{background:#1f7a3d}.bdg.wait{background:#7a5a1f}
.eb{padding:12px;flex:1;display:flex;flex-direction:column}
.eb h3{margin:0 0 4px;font-size:16px}
.eb .meta{margin:0}
.ov{margin:8px 0 0;font-size:14px;opacity:.85;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.ov.open{display:block}
.more{background:none;border:0;color:var(--accent);padding:4px 0;font-size:13px;align-self:flex-start;cursor:pointer}
.ea{margin-top:auto;display:flex;justify-content:flex-end;padding-top:8px}
.wbtn{width:34px;height:34px;padding:0;border-radius:50%}
.wbtn.on{background:var(--accent);color:#141922;border-color:var(--accent)}
#epSel{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;width:100%;max-width:420px;margin-bottom:24px}

.troll-admin{opacity:0.35;font-size:11px;font-family:monospace;letter-spacing:1px;background:transparent;border:1px dashed var(--line);color:var(--muted);padding:4px 10px;margin-top:20px;display:inline-block;border-radius:4px;cursor:pointer;transition:opacity .2s}
.troll-admin:hover{opacity:0.9;color:var(--accent);border-color:var(--accent)}

#totop{position:fixed;bottom:24px;right:24px;z-index:30;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px;cursor:pointer;display:none;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:opacity .2s}
#totop:hover{border-color:var(--accent);color:var(--accent)}

#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:999}

.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:720px;width:100%;max-height:85vh;overflow:auto;padding:20px}
.pn{margin:0 0 18px}
.pn h3{margin:0 0 6px;font:700 18px Georgia,serif}
.pn ul{margin:0;padding-left:20px}
.pn li{margin:3px 0}
.pn.old{opacity:.7}

#go,#save,#pnok,#tramp,#demobtn{background:var(--accent);color:#141922;border-color:var(--accent);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}

#amb{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center top;opacity:0;transition:opacity .6s;pointer-events:none}
#amb.on{opacity:var(--bg-opacity)}

.sov{margin:0 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}.sov summary{cursor:pointer;font-weight:600}.sov p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.zoomb{position:absolute;right:6px;bottom:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;padding:0;cursor:pointer;z-index:2}
#lightbox{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom))}
#lightbox img{max-width:100%;max-height:100%;border-radius:10px}
.pfbar{display:flex;gap:8px;margin:0 0 14px}.pfbar button.on{background:var(--accent);color:#141922;border-color:var(--accent);font-weight:700}
.studios{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.studios img{height:26px;max-width:92px;object-fit:contain;background:#fff;border-radius:6px;padding:3px 7px}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}#fx span{position:absolute;top:-40px;opacity:.3;color:var(--accent);animation:fxfall linear infinite}
@keyframes fxfall{to{transform:translateY(115vh) rotate(360deg)}}
body.theater #fx{display:none}
.qf{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:16px;padding:0;z-index:2;cursor:pointer}.qf.on{color:var(--accent)}
.party-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.party-bar.active{border-color:var(--accent);box-shadow:0 0 12px rgba(255,122,69,0.2)}
.party-badge{background:var(--accent);color:#141922;font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px}
.party-peers{font-size:13px;color:var(--muted)}
.party-btn{background:var(--accent);color:#141922;border-color:var(--accent);font-weight:700}
.party-profile{display:flex;align-items:center;gap:8px;margin-left:auto}
.party-profile img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--accent);background:#222a39}
.party-profile input{padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px;width:120px}
.party-chat{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:12px 0;display:flex;flex-direction:column;overflow:hidden}
.chat-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.chat-msgs{height:185px;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.cmsg{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.35}
.cmsg img{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#222a39;border:1px solid var(--line)}
.cmsg-body{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;max-width:85%;word-break:break-word}
.cmsg.me .cmsg-body{border-color:var(--accent)}
.cmsg-meta{font-size:11px;color:var(--muted);margin-bottom:2px;display:flex;gap:6px;align-items:center}
.cmsg-meta b{color:var(--text)}
.cmsg-sys{text-align:center;font-size:12px;color:var(--muted);font-style:italic}
.chat-form{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface)}
.chat-form input{flex:1;min-width:0;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px}

    else cell += c;
  }
  row.push(cell); if (row.some(x => x)) rows.push(row);
  if (rows.length < 2) return say('Empty CSV.');
  const h = rows[0].map(x => x.trim().toLowerCase());
  const col = (...n) => h.findIndex(x => n.includes(x));
  const cId = col('tmdbid'), cIm = col('const'), cT = col('title', 'name'), cY = col('year'), cTy = col('type', 'title type');
  if (cId < 0 && cIm < 0 && cT < 0) return say('No Title / Name column found.');
  const data = rows.slice(1, 201);
  const norm = (type, o) => ({ type, id: o.id, name: o.title || o.name || '', poster: o.poster_path, vote: o.vote_average || 0, date: o.release_date || o.first_air_date || '', added: Date.now() });
  const fav = lsGet('fav'), fresh = []; let miss = 0;
  for (let i = 0; i < data.length; i++) {
    say(`Importing ${i + 1}/${data.length}…`);
    const r = data[i], g = c => c >= 0 ? (r[c] || '').trim() : '';
    const tv = /series|^tv$/.test(g(cTy).toLowerCase());
    let hit = null;
    try {
      if (/^\d+$/.test(g(cId))) { const t = tv ? 'tv' : 'movie'; hit = norm(t, await api(`/${t}/${g(cId)}`)); }
      else if (/^tt\d+$/.test(g(cIm))) {
        const f = await api(`/find/${g(cIm)}`, '&external_source=imdb_id');
        if (f.movie_results && f.movie_results[0]) hit = norm('movie', f.movie_results[0]);
        else if (f.tv_results && f.tv_results[0]) hit = norm('tv', f.tv_results[0]);
      } else if (g(cT)) {
        const t = tv ? 'tv' : 'movie', y = g(cY) ? (tv ? '&first_air_date_year=' : '&year=') + encodeURIComponent(g(cY)) : '';
        const sr = await api(`/search/${t}`, `&query=${encodeURIComponent(g(cT))}${y}`);
        if (sr.results && sr.results[0]) hit = norm(t, sr.results[0]);
      }
    } catch (e) {}
    if (!hit || !hit.id || isBlocked(hit.type, hit.id)) { miss++; continue; }
    if (fav.some(x => same(x, hit.type, hit.id)) || fresh.some(x => same(x, hit.type, hit.id))) continue;
    fresh.push(hit);
  }
  lsSet('fav', [...fresh, ...fav]);
  listView();
  say(`Imported ${fresh.length} new, ${miss} not found.`);
}

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.05, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.05);
  } catch (e) {}
};

function triggerConfetti() {
  const c = document.getElementById('confetti-canvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  c.width = window.innerWidth;
  c.height = window.innerHeight;
  const particles = [];
  const colors = ['#ff7a45', '#8a45ff', '#2ecc71', '#00bcd4', '#e91e63', '#ffffff'];
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: c.width / 2,
      y: c.height / 2,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.7) * 14,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: Math.random() * 6 + 4,
      life: 1
    });
  }
  const render = () => {
    ctx.clearRect(0, 0, c.width, c.height);
    let active = false;
    particles.forEach(p => {
      if (p.life <= 0) return;
      active = true;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.3;
      p.life -= 0.018;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    if (active) requestAnimationFrame(render);
    else ctx.clearRect(0, 0, c.width, c.height);
  };
  render();
}

const cache = new Map();
const api = (path, params = '') => {
  const activeKey = key || '5d0979bf39cd11dbb4d24177b8b4b76c';
  const url = `https://api.themoviedb.org/3${path}?api_key=${activeKey}&language=${lang}${params}`;
  const hit = cache.get(url);
  if (hit && Date.now() - hit.t < 600000) return hit.p;
  const p = fetch(url).then(r => {
    if (!r.ok) throw new Error(r.status === 401 ? 'Invalid TMDB API key.' : 'TMDB error ' + r.status);
    return r.json();
  }).then(j => {
    if (j && Array.isArray(j.results)) {

      j.results = j.results.filter(x => !isBlocked(x.media_type || t, x.id));
    }
    return j;
  });
  cache.set(url, { t: Date.now(), p });
  p.catch(() => cache.delete(url));
  return p;
};

function broadcastPartyState(force = false, hard = false) {
  if (!party.active || party.role !== 'host' || !current) return;
  const now = Date.now();
  if (!force && now - party.lastBroadcast < 1200) return;
  party.lastBroadcast = now;
  const payload = {
    type: 'sync',
    force,
    hard,
    mediaType: current.type,
    id: current.id,
    s: current.s || 1,
    e: current.e || 1,
    prov: playerProv,
    time: party.lastTime || 0,
    state: party.lastState || 'playing',
    sentAt: now
  };
  party.conns.forEach(c => { if (c.open) try { c.send(payload); } catch (err) {} });
}

function startWatchParty() {
  if (typeof Peer === 'undefined') { alert('PeerJS failed to load. Check your internet connection.'); return; }
  leaveWatchParty();
  const roomId = 'sr-' + Math.random().toString(36).slice(2, 8) + '-' + Date.now().toString(36).slice(-4);
  party = newParty({ active: true, role: 'host', roomId, lastState: 'playing' });
  updatePartyUI();
  const peer = new Peer(roomId, PEER_CFG);
  party.peer = peer;
  peer.on('open', () => {
    updatePartyUI();
    navigator.clipboard.writeText(getPartyUrl()).catch(() => {});
  });
  peer.on('connection', conn => {
    party.conns.push(conn);
    conn.on('open', () => {
      updatePartyUI();
      broadcastPartyState(true);
      try { conn.send({ type: 'history', msgs: party.messages.filter(m => !m.sys).slice(-30).map(m => ({ type: 'chat', id: m.id, name: m.name, pfp: m.pfp, text: m.text, ts: m.ts })) }); } catch (e) {}
      appendChatMessage({ sys: true, text: 'A friend joined the party!' }, true);
    });
    conn.on('data', msg => {
      if (!msg) return;
      if (msg.type === 'req_sync') broadcastPartyState(true);
      else if (msg.type === 'chat') {
        appendChatMessage(msg, false);
        party.conns.forEach(other => { if (other !== conn && other.open) try { other.send(msg); } catch (e) {} });
      }
    });
    conn.on('close', () => {
      party.conns = party.conns.filter(c => c !== conn);
      updatePartyUI();
      appendChatMessage({ sys: true, text: 'A friend left the party.' }, true);
    });
  });
  peer.on('disconnected', () => { if (!party.closing && party.peer === peer) { try { peer.reconnect(); } catch (e) {} } });
  peer.on('error', err => {
    if (party.closing || party.peer !== peer) return;
    if (err && err.type === 'unavailable-id') { startWatchParty(); return; }
    if (err && (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error')) setTimeout(() => { if (!party.closing && party.peer === peer && peer.disconnected) { try { peer.reconnect(); } catch (e) {} } }, 2000);
  });
}

function joinWatchParty(roomId) {
  if (typeof Peer === 'undefined') return;
  leaveWatchParty();
  party = newParty({ active: true, role: 'guest', roomId, lastState: 'playing' });
  updatePartyUI();
  const peer = new Peer(PEER_CFG);
  party.peer = peer;
  const connectHost = () => {
    if (party.closing || party.peer !== peer || !peer.open) return;
    const conn = peer.connect(roomId, { reliable: true });
    party.hostConn = conn;
    let opened = false;
    const retry = () => {
      if (party.closing || party.peer !== peer || party.hostConn !== conn) return;
      party.retry++;
      updatePartyUI();
      setTimeout(connectHost, Math.min(1500 * party.retry, 8000));
    };
    conn.on('open', () => {
      opened = true; party.retry = 0;
      updatePartyUI();
      conn.send({ type: 'req_sync' });
      const prof = getUserProfile();
      appendChatMessage({ sys: true, text: `Connected to party chat as ${prof.name}` }, true);
    });
    conn.on('data', msg => {
      if (!msg) return;
      if (msg.type === 'sync') applyHostSync(msg);
      else if (msg.type === 'chat') appendChatMessage(msg, false);
      else if (msg.type === 'history' && Array.isArray(msg.msgs)) msg.msgs.forEach(m => appendChatMessage(m, false));
    });
    conn.on('close', retry);
    conn.on('error', retry);
    setTimeout(() => { if (!opened && party.hostConn === conn && !party.closing) { try { conn.close(); } catch (e) {} retry(); } }, 10000);
  };
  peer.on('open', connectHost);
  peer.on('disconnected', () => { if (!party.closing && party.peer === peer) { try { peer.reconnect(); } catch (e) {} } });
  peer.on('error', err => {
    if (party.closing || party.peer !== peer) return;
    if (err && err.type === 'peer-unavailable') { party.retry++; updatePartyUI(); setTimeout(connectHost, Math.min(2000 * party.retry, 8000)); }
  });
}

function partyCountdown(t) {
  const nb = document.getElementById('next'); if (!nb) return;
  clearInterval(nextTimer); clearInterval(window.__pcd);
  const mm = Math.floor(t / 60), ss = String(t % 60).padStart(2, '0'); let n = 5;
  const paint = () => { nb.innerHTML = `<div class="nextup"><span>⚡ Synced to ${mm}:${ss}. Everyone tap ▶ when this hits GO: <b>${n > 0 ? n : 'GO!'}</b></span></div>`; };
  paint();
  window.__pcd = setInterval(() => { n--; paint(); if (n < -2) { clearInterval(window.__pcd); nb.innerHTML = ''; } }, 1000);
}
function applyHostSync(msg) {
  if (!current) return;
  const rttSec = Math.max(0, (Date.now() - (msg.sentAt || Date.now())) / 1000);
  const targetTime = Math.floor((msg.time || 0) + (!msg.hard && msg.state === 'playing' ? rttSec : 0));

  // Switch title if host navigated
  if (String(current.id) !== String(msg.id) || current.type !== msg.mediaType) {
    watch(msg.mediaType, msg.id, { s: msg.s, e: msg.e, t: targetTime }, true);
    if (msg.hard) setTimeout(() => partyCountdown(targetTime), 1800);
    return;
  }
  // Switch provider if needed
  if (msg.prov && playerProv !== msg.prov) {
    playerProv = msg.prov;
    const ps = document.getElementById('provsel');
    if (ps) ps.value = playerProv;
  }
  // Switch episode if host changed season/episode
  if (current.type === 'tv' && (current.s !== msg.s || current.e !== msg.e)) {
    current.s = msg.s;
    current.e = msg.e;
    const en = document.getElementById('epnow');
    if (en) en.textContent = `Now playing: S${msg.s} E${msg.e}`;
    const f = document.getElementById('frame');
    if (f) f.src = getEmbedUrl(playerProv, current.type, current.id, msg.s, msg.e, targetTime);
    if (epRedraw) epRedraw();
    if (msg.hard) partyCountdown(targetTime);
    return;
  }
  // Manual "Sync Time" from the host: always jump, no cooldown, then everyone presses play together
  if (msg.hard) {
    party.lastTime = targetTime; party.lastTimeAt = 0; party.lastCorrect = Date.now(); party.synced = true;
    const hf = document.getElementById('frame');
    if (hf) hf.src = getEmbedUrl(playerProv, current.type, current.id, current.s, current.e, targetTime);
    partyCountdown(targetTime);
    return;
  }
  // Drift correction: never touch the player while the host is paused, and reload at most once per 30s
  if (msg.state !== 'playing' && !msg.force) return;
  const now = Date.now(), drift = Math.abs((party.lastTime || 0) - targetTime);
  const fresh = party.lastTimeAt && now - party.lastTimeAt < 8000;
  const first = !party.synced;
  party.synced = true;
  if (now - (party.lastCorrect || 0) < 30000) return;
  if ((first && drift > 4) || (msg.force && drift > 10) || (fresh && drift > 15)) {
    party.lastTime = targetTime; party.lastTimeAt = 0; party.lastCorrect = now;
    const f = document.getElementById('frame');
    if (f) f.src = getEmbedUrl(playerProv, current.type, current.id, current.s, current.e, targetTime);
  }
}

window.addEventListener('message', ev => {
  const f = document.getElementById('frame');
  if (!f || ev.source !== f.contentWindow) return;
  let p = ev.data;
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { return; } }
  if (!p || !p.event) return;
  const now = Date.now();
  if (typeof p.currentTime === 'number') { party.lastTime = p.currentTime; party.lastTimeAt = Date.now(); }
  if (p.event === 'timeupdate' && typeof p.currentTime === 'number' && current) {
    const k = current.type + '/' + current.id + '/' + current.s + '/' + current.e;
    if (wt.k === k && p.currentTime > wt.t && p.currentTime - wt.t <= 15) { wt.acc += p.currentTime - wt.t; if (wt.acc >= 10) flushWT(current.type); }
    wt.k = k; wt.t = p.currentTime;
  }
  if ((p.event === 'pause' || p.event === 'ended') && current) flushWT(current.type);
  if (p.event === 'play') {
    party.lastState = 'playing';
    if (party.active && party.role === 'host') broadcastPartyState(true);
  } else if (p.event === 'pause') {
    party.lastState = 'paused';
    lastSave = now; saveProgress(p.currentTime || 0, p.duration || 0, false);
    if (party.active && party.role === 'host') broadcastPartyState(true);
  } else if (p.event === 'ended') {
    party.lastState = 'paused';
    if (current && current.type === 'tv') { setW(current.id, current.s, current.e, true); if (epRedraw) epRedraw(); }
    saveProgress(0, 0, true); if (current && current.type === 'movie') markDone('movie', current.id); nextUp();
  } else if (p.event === 'timeupdate') {
    party.lastState = 'playing';
    if (now - lastSave > 5000) {
      lastSave = now; saveProgress(p.currentTime || 0, p.duration || 0, false);
    }
    if (party.active && party.role === 'host') broadcastPartyState(false);
  }
});

    const v = (bgslider.value / 100).toFixed(2);
    document.getElementById('bgval').textContent = bgslider.value + '%';

    try { localStorage.setItem('bg_opacity', v); } catch (e) {}

  const saveCT = (k, v) => { const c = getCT(); if (v) c[k] = v; else delete c[k]; try { localStorage.setItem('custom_theme', JSON.stringify(c)); } catch (e) {} applyCustomTheme(); };
  [['cacc', 'accent'], ['cbg', 'bg'], ['csf', 'surface']].forEach(([i, k]) => { const el = document.getElementById(i); if (el) el.oninput = () => saveCT(k, el.value); });

      if (navigator.share) await navigator.share({ title: customBrand, url });
      else { await navigator.clipboard.writeText(url); sa.textContent = 'Link copied'; }
    } catch (e) {}
  };
  const uc = document.getElementById('upchk'); if (uc) uc.onclick = () => checkUpdate(true);
  const say = t => { const m = document.getElementById('bkmsg'); if (m) m.textContent = t; };
  let p2pPeer = null;
  const p2pStop = () => { if (p2pPeer) { try { p2pPeer.destroy(); } catch (e) {} p2pPeer = null; } };
  const ps = document.getElementById('p2psend'), pr = document.getElementById('p2precv');
  if (ps) ps.onclick = () => {
    if (typeof Peer === 'undefined') return say('Peer library not loaded. Check your connection.');
    p2pStop();
    const code = String(Math.floor(100000 + Math.random() * 900000));
    p2pPeer = new Peer('sr-sync-' + code, PEER_CFG);
    p2pPeer.on('open', () => say(`Code ${code} — open "Receive" on the other device and enter it (valid 5 min).`));
    p2pPeer.on('error', () => say('Could not start. Try again.'));
    p2pPeer.on('connection', conn => {
      conn.on('open', () => conn.send({ type: 'library', data: buildBackup() }));
      conn.on('data', m => { if (m && m.type === 'ack') { say('Library sent ✓'); setTimeout(p2pStop, 1000); } });
    });
    setTimeout(p2pStop, 300000);
  };
  if (pr) pr.onclick = () => {
    if (typeof Peer === 'undefined') return say('Peer library not loaded. Check your connection.');
    const code = (prompt('Enter the 6-digit code shown on the other device:') || '').trim();
    if (!/^\d{6}$/.test(code)) return;
    p2pStop();
    say('Connecting…');
    p2pPeer = new Peer(PEER_CFG);
    p2pPeer.on('error', () => say('Could not connect. Check the code and try again.'));
    p2pPeer.on('open', () => {
      const conn = p2pPeer.connect('sr-sync-' + code, { reliable: true });
      const to = setTimeout(() => say('No answer. Check the code and try again.'), 15000);
      conn.on('data', m => {
        if (!m || m.type !== 'library' || !m.data) return;
        clearTimeout(to);
        pendingImport = m.data;
        if (f && f.onchange) f.onchange();
        try { conn.send({ type: 'ack' }); } catch (e) {}
        setTimeout(p2pStop, 1500);
      });
    });
  };
  if (exp) exp.onclick = () => {
    const data = buildBackup();
    const a = document.createElement('a');

    a.download = 'screenroom-backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    say('Backup created. Check your downloads.');
  };
  if (imp && f) {
    imp.onclick = () => f.click();
    f.onchange = async () => {
      try {
        const d = pendingImport || JSON.parse(await f.files[0].text());
        pendingImport = null;
        if (d.app !== 'screenroom') throw new Error('bad file');
        const merge = (k, inc, prefer) => {
          const out = lsGet(k);
          (Array.isArray(inc) ? inc : []).filter(x => x && x.type && x.id).forEach(a => {
            const i = out.findIndex(c => same(c, a.type, a.id));
            if (i < 0) out.push(a); else if (prefer) out[i] = a;
          });
          lsSet(k, out);
        };
        merge('fav', d.fav, false); merge('hist', d.hist, false); merge('cw', d.cw, true);
        if (d.watched && typeof d.watched === 'object') {
          const w = getW();
          Object.keys(d.watched).forEach(k => { w[k] = [...new Set([...(w[k] || []), ...(d.watched[k] || [])])]; });
          try { localStorage.setItem('watched', JSON.stringify(w)); } catch (e2) {}
        }
        if (d.lists && typeof d.lists === 'object' && !Array.isArray(d.lists)) {
          const L = getLists();
          Object.keys(d.lists).forEach(n => { const out = L[n] || []; (Array.isArray(d.lists[n]) ? d.lists[n] : []).filter(x => x && x.type && x.id).forEach(a => { if (!out.some(c => same(c, a.type, a.id))) out.push(a); }); L[n] = out; });
          setLists(L);
        }
        if (d.posters && typeof d.posters === 'object' && !Array.isArray(d.posters)) { try { localStorage.setItem('posters', JSON.stringify({ ...d.posters, ...getPosters() })); } catch (e2) {} }
        if (Array.isArray(d.done)) lsSet('done', [...new Set([...lsGet('done'), ...d.done.filter(x => typeof x === 'string')])]);
        if (d.wtime && typeof d.wtime === 'object') { const w = getWT(); ['movie', 'tv'].forEach(k => { w[k] = Math.max(+w[k] || 0, +d.wtime[k] || 0); }); try { localStorage.setItem('wtime', JSON.stringify(w)); } catch (e2) {} }
        if (d.myrate && typeof d.myrate === 'object' && !Array.isArray(d.myrate)) { try { localStorage.setItem('myrate', JSON.stringify({ ...d.myrate, ...getMR() })); } catch (e2) {} }
        if (d.key && !key) { key = String(d.key); try { localStorage.setItem('tmdb_key', key); } catch (e) {} }
        if (d.profile && typeof d.profile === 'object') saveUserProfile(d.profile.name, d.profile.pfp);
        if (tab === 'list') listView(); else if (key) home();
        say('Backup imported.');
      } catch (e) { say('That file is not a Screenroom backup.'); }
      f.value = '';
    };
  }
}

    <select id="lfsort"><option value="added"${listSort==='added'?' selected':''}>Date added</option><option value="alpha"${listSort==='alpha'?' selected':''}>Alphabetical</option><option value="rating"${listSort==='rating'?' selected':''}>Rating</option><option value="release"${listSort==='release'?' selected':''}>Release date</option><option value="mine"${listSort==='mine'?' selected':''}>My rating</option></select>
    <select id="lfstat"><option value="all"${listStatus==='all'?' selected':''}>All</option><option value="unwatched"${listStatus==='unwatched'?' selected':''}>Unwatched</option><option value="done"${listStatus==='done'?' selected':''}>Completed</option></select>
    <button id="csvexp">⬇ CSV</button><button id="csvimp">⬆ Import CSV</button><button id="hidew">${localStorage.getItem('hidew') === '1' ? '🙈 Hiding watched on Home' : '👁 Show watched on Home'}</button><input id="csvfile" type="file" accept=".csv,text/csv" hidden><button id="wrapbtn">🎁 My Wrapped</button><button id="pickrnd">🎲 Pick for me</button><span id="csvstat" class="meta"></span>
  </div>`;

  const filterList = l => {
    let out = l.filter(x => listFilter === 'all' || x.type === listFilter);
    if (listStatus !== 'all') out = out.filter(x => isDone(x.type, x.id) === (listStatus === 'done'));
    if (listSort === 'rating') out = [...out].sort((a, b) => (b.vote || 0) - (a.vote || 0));
    else if (listSort === 'release') out = [...out].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    else if (listSort === 'mine') out = [...out].sort((a, b) => (getMR()[b.type + '/' + b.id] || 0) - (getMR()[a.type + '/' + a.id] || 0));
    if (listSort === 'alpha') {
      out = [...out].sort((a,b) => (a.name || '').localeCompare(b.name || ''));
    }
    return out;
  };

  const sec = (title, l, extra = '') => l.length ? `<div class="row"><div class="hd"><h2 class="sec">${title}</h2>${extra}</div><div class="grid">` +
    l.filter(x => x.poster).map(x => `<div class="card" tabindex="0" data-type="${x.type}" data-id="${x.id}">
      <img loading="lazy" decoding="async" src="${IMG}w342${x.poster}" alt="${esc(x.name)}">
      <div>${esc(x.name)}<small>${x.type === 'tv' ? 'Series' : 'Movie'}</small></div></div>`).join('') + '</div></div>' : '';
  
  const favList = filterList(lsGet('fav').filter(x => !isBlocked(x.type, x.id)));
  const histList = filterList(lsGet('hist').filter(x => !isBlocked(x.type, x.id)));

  const customLists = getLists();
  const listsHtml = Object.keys(customLists).map(n => sec(esc(n), filterList((customLists[n] || []).filter(x => !isBlocked(x.type, x.id))), `<button class="dellist" data-n="${esc(n)}">Delete list</button>`)).join('');
  const body = statsDashboard() + filterHeader + listsHtml + sec('Favorites', favList) + sec('History', histList, '<button id="clr">Clear history</button>')
    || statsDashboard() + filterHeader + emptyState('Your list is empty', 'Open a title and tap “♡ Add to my list” to keep it here.');
  app.innerHTML = body + backupBox();
  bindCards();
  bindBackup();
  
  const lfsel = document.getElementById('lfsel');
  if (lfsel) lfsel.onchange = ev => { listFilter = ev.target.value; listView(); };
  document.querySelectorAll('.dellist').forEach(b => b.onclick = () => {
    if (!confirm('Delete this list? Titles stay elsewhere in Screenroom.')) return;
    const L = getLists(); delete L[b.dataset.n]; setLists(L); listView();
  });
  const wrapbtn = document.getElementById('wrapbtn');
  if (wrapbtn) wrapbtn.onclick = showWrapped;
  const pickrnd = document.getElementById('pickrnd');
  if (pickrnd) pickrnd.onclick = () => {
    const pool = lsGet('fav').filter(x => !isDone(x.type, x.id) && !isBlocked(x.type, x.id));
    if (!pool.length) { pickrnd.textContent = 'Nothing unwatched in your list'; return; }
    const x = pool[Math.floor(Math.random() * pool.length)];
    watch(x.type, x.id);
  };
  const hidew = document.getElementById('hidew');
  if (hidew) hidew.onclick = () => { try { localStorage.setItem('hidew', localStorage.getItem('hidew') === '1' ? '0' : '1'); } catch (e) {} listView(); };
  const csvfile = document.getElementById('csvfile'), csvimp = document.getElementById('csvimp');
  if (csvimp) csvimp.onclick = () => csvfile.click();
  if (csvfile) csvfile.onchange = () => { if (csvfile.files[0]) importCsv(csvfile.files[0]); };
  const lfstat = document.getElementById('lfstat');
  if (lfstat) lfstat.onchange = ev => { listStatus = ev.target.value; listView(); };
  const csvexp = document.getElementById('csvexp');
  if (csvexp) csvexp.onclick = () => {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = [['tmdbID', 'Title', 'Year', 'Type', 'List', 'Watched']];
    const add = (l, name) => l.forEach(x => rows.push([x.id, x.name, (x.date || '').slice(0, 4), x.type, name, isDone(x.type, x.id) ? 'yes' : 'no']));
    add(lsGet('fav'), 'Favorites'); add(lsGet('hist'), 'History');
    const blob = new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'screenroom-list.csv';
    document.body.appendChild(a); a.click(); a.remove();
  };
  const lfsort = document.getElementById('lfsort');
  if (lfsort) lfsort.onchange = ev => { listSort = ev.target.value; listView(); };

  const clr = document.getElementById('clr');
  if (clr) clr.onclick = () => { lsSet('hist', []); listView(); };
}

let searchTimer;
q.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const v = q.value.trim();
  if (!key) return showSetup();
  if (!v) { searchDrop.classList.remove('open'); searchDrop.innerHTML = ''; return home(); }
  
  try {
    let recent = JSON.parse(localStorage.getItem('recent_searches') || '[]');
    recent = [v, ...recent.filter(x => x !== v)].slice(0, 5);
    localStorage.setItem('recent_searches', JSON.stringify(recent));
  } catch (e) {}

  searchTimer = setTimeout(async () => {
    try {
      if (activeView.kind !== 'search') pushHistoryState();
      activeView = { kind: 'search', query: v };
      current = null;
      const ep = (tab === 'all' || tab === 'list' || tab === 'upcoming') ? 'multi' : tab;
      const d = await api('/search/' + ep, '&query=' + encodeURIComponent(v));
      const results = (d.results || []).filter(i => i.media_type !== 'person' && i.poster_path).slice(0, 5);
      if (results.length > 0) {
        searchDrop.innerHTML = results.map(i => {
          const type = i.media_type || (i.title ? 'movie' : 'tv');
          const name = i.title || i.name;
          const year = (i.release_date || i.first_air_date || '').slice(0, 4);
          return `<div class="sdrop-item" data-type="${type}" data-id="${i.id}"><span>${esc(name)} (${year})</span><small>${type === 'tv' ? 'Series' : 'Movie'}</small></div>`;
        }).join('');
        searchDrop.classList.add('open');
        searchDrop.querySelectorAll('.sdrop-item').forEach(el => {
          el.onclick = () => {
            searchDrop.classList.remove('open');
            q.value = '';
            watch(el.dataset.type, el.dataset.id);
          };
        });
      } else {
        searchDrop.classList.remove('open');
      }
      render(d.results, `Results for “${v}”`, false);
    } catch (e) { app.innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
  }, 350);
});

q.addEventListener('focus', () => {
  try {
    const recent = JSON.parse(localStorage.getItem('recent_searches') || '[]');
    if (recent.length > 0 && !q.value.trim()) {
      searchDrop.innerHTML = '<div style="padding:6px 14px;font-size:12px;color:var(--muted)">Recent searches</div>' + recent.map(term => `<div class="sdrop-item recent-term"><span>${esc(term)}</span><small>history</small></div>`).join('');
      searchDrop.classList.add('open');
      searchDrop.querySelectorAll('.recent-term').forEach(el => {
        el.onclick = () => {
          q.value = el.querySelector('span').textContent;
          searchDrop.classList.remove('open');
          q.dispatchEvent(new Event('input'));
        };
      });
    }
  } catch (e) {}
});

document.addEventListener('click', ev => {
  if (!ev.target.closest('.search-wrap')) searchDrop.classList.remove('open');
});

function getEmbedUrl(prov, type, id, s, e, t) {
  const prog = t > 0 ? `&progress=${t}` : '';
  if (prov === 'vidsrc') {
    return type === 'movie' ? `https://vidsrc.to/embed/movie/${id}` : `https://vidsrc.to/embed/tv/${id}/${s}/${e}`;
  }
  if (prov === 'multiembed') {
    return type === 'movie' ? `https://multiembed.mov/?video_id=${id}&tmdb=1` : `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}`;
  }
  return type === 'movie'
    ? `https://vidy.st/movie/${id}?color=FF7A45${prog}`
    : `https://vidy.st/tv/${id}/${s}/${e}?color=FF7A45&nextEpisode=true&episodeSelector=true${prog}`;
}

async function watch(type, id, res = {}, fromBack = false) {
  if (!key) return showSetup();
  if (!fromBack && !(activeView.kind === 'watch' && activeView.type === type && String(activeView.id) === String(id))) {
    pushHistoryState();
  }
  activeView = { kind: 'watch', type, id, res: { ...res } };
  updateBackVisibility();
  window.scrollTo({ top: 0, behavior: 'instant' });

  if (isBlocked(type, id)) {
    app.innerHTML = emptyState('Title unavailable', 'This title has been removed at a rights holder’s request.');
    return;
  }
  epRedraw = null;
  clearInterval(nextTimer);
  updateFavicon(true);
  app.innerHTML = '<div class="player sk"></div>';
  try {
    const [d, creditsData, releaseData] = await Promise.all([
      api(`/${type}/${id}`),
      api(`/${type}/${id}/credits`).catch(() => ({ cast: [], crew: [] })),
      api(`/${type}/${id}/${type === 'movie' ? 'release_dates' : 'content_ratings'}`).catch(() => ({ results: [] }))
    ]);

    const name = d.title || d.name;
    const year = (d.release_date || d.first_air_date || '').slice(0, 4);
    const mins = type === 'movie' ? d.runtime : (d.episode_run_time && d.episode_run_time[0]);
    const dur = mins ? (mins >= 60 ? Math.floor(mins / 60) + 'h' + (mins % 60 ? ' ' + (mins % 60) + 'm' : '') : mins + 'm') : '';
    const seasonsTxt = type === 'tv' && d.number_of_seasons ? ` · ${d.number_of_seasons} season${d.number_of_seasons > 1 ? 's' : ''}` : '';
    { const pm = getProvMap()[type + '/' + id]; if (pm && !party.active && ['vidyst', 'multiembed', 'vidsrc'].includes(pm)) playerProv = pm; }
    const s = res.s || 1, e = res.e || 1, t = res.t || 0;
    current = { type, id, name, poster: d.poster_path, s, e, seasons: d.number_of_seasons, vote: d.vote_average || 0, date: d.release_date || d.first_air_date || '' };

    document.body.classList.toggle('tv', type === 'tv');
    const epHash = type === 'tv' ? `/${s}/${e}` : '';
    const partyHash = (party.active && party.roomId) ? `?party=${encodeURIComponent(party.roomId)}&prov=${encodeURIComponent(playerProv)}` : '';
    history.replaceState(null, '', location.pathname + location.search + '#' + type + '/' + id + epHash + partyHash);
    updateBackVisibility();
    
    let cert = '';
    if (type === 'movie' && releaseData.results) {
      const us = releaseData.results.find(r => r.iso_3166_1 === 'US');
      if (us && us.release_dates) {
        const found = us.release_dates.find(rd => rd.certification);
        if (found) cert = found.certification;
      }
    } else if (type === 'tv' && releaseData.results) {

    }

    let directorOrCreator = '';

      if (dir) { directorOrCreator = dir.name; directorId = dir.id; }
    } else {
      const creator = (d.created_by || [])[0];
      if (creator) { directorOrCreator = creator.name; directorId = creator.id; }
    }

    let financialTxt = '';
    if (type === 'movie' && (d.budget > 0 || d.revenue > 0)) {
      const fmtCurr = n => '$' + n.toLocaleString();

    }

    const imdbLink = d.imdb_id ? `https://www.imdb.com/title/${d.imdb_id}/` : null;
    const tmdbLink = `https://www.themoviedb.org/${type}/${id}`;

      <div class="icol">

        <p class="meta">
          ${cert ? `<span class="badge-tag">${esc(cert)}</span>` : ''}
          ${type === 'tv' ? 'Series' : 'Movie'}${year ? ' · ' + year : ''}${dur ? ' · ' + dur : ''}${seasonsTxt}${d.vote_average ? ' · ★ ' + d.vote_average.toFixed(1) : ''}
        </p>

      const nb = document.getElementById('next');
      if (rc && nb) {

        document.getElementById('rsn').onclick = () => { nb.innerHTML = ''; };
        document.getElementById('rsy').onclick = () => {

          if (type === 'tv') { current.s = rc.s; current.e = rc.e; const en = document.getElementById('epnow'); if (en) en.textContent = `Now playing: S${rc.s} E${rc.e}`; if (epRedraw) epRedraw(); }

      const n = (prompt('Add to / remove from which list?' + (names.length ? '\nYour lists: ' + names.join(', ') : '') + '\nType a name (a new name creates a list):') || '').trim().slice(0, 30);
      if (!n) return;
      const arr = L[n] || [], has = arr.some(x => same(x, current.type, current.id));
      L[n] = has ? arr.filter(x => !same(x, current.type, current.id)) : [{ type: current.type, id: current.id, name: current.name, poster: current.poster, vote: current.vote || 0, date: current.date || '', added: Date.now() }, ...arr];
      setLists(L);
      btn.textContent = has ? '✓ Removed' : '✓ Added';
      setTimeout(() => { btn.textContent = '＋ List'; }, 1800);
    };
    document.getElementById('fav').onclick = ev => {
      const on = toggleFav(current);
      ev.target.classList.toggle('on', on);
      ev.target.textContent = on ? '♥ In my list' : '♡ Add to my list';
    };
    if (type === 'tv') { document.getElementById('nextep').onclick = nextEpisodeNow; loadEpisodes(d); }
  } catch (err) { app.innerHTML = `<p class="msg">${esc(err.message)}</p>`; }
}

async function nextEpisodeNow() {
  if (!current || current.type !== 'tv') return;
  try {
    const sd = await api(`/tv/${current.id}/season/${current.s}`);
    let s = current.s, e = current.e + 1;
    if (e > sd.episodes.length) { s++; e = 1; if (current.seasons && s > current.seasons) return; }
    playEpisode(s, e);
  } catch (err) {}
}

let epRedraw = null, epView = 'grid';
try { epView = localStorage.getItem('epview') || 'grid'; } catch (e) {}
const getW = () => { try { return JSON.parse(localStorage.getItem('watched') || '{}'); } catch (e) { return {}; } };
const isW = (id, s, e) => (getW()[id] || []).includes(s + 'x' + e);
function setW(id, s, e, on) {
  const w = getW(), l = new Set(w[id] || []), k = s + 'x' + e;
  if (on) l.add(k); else l.delete(k);
  w[id] = [...l];
  try { localStorage.setItem('watched', JSON.stringify(w)); } catch (x) {}
}

async function loadEpisodes(d) {
  const box = document.getElementById('eps');
  if (!box || !current) return;
  const id = current.id;
  const seasons = (d.seasons || []).filter(x => x.episode_count > 0);
  if (!seasons.length) return;
  let showS = current.s;
  const en = document.getElementById('epnow'); if (en) en.textContent = `Now playing: S${current.s} E${current.e}`;
  box.innerHTML = '<div class="hd"><h2 class="sec">Seasons</h2></div><div class="seasons">' + seasons.map(x => `<div class="scard" tabindex="0" data-s="${x.season_number}"><span class="cbadge">Current</span>${x.poster_path ? `<img loading="lazy" decoding="async" src="${IMG}w342${x.poster_path}" alt="">` : '<div class="noimg"></div>'}<div class="sinfo"><b>${esc(x.name)}</b><span>${esc((x.air_date || '').slice(0, 4))}</span><span>${x.episode_count} episodes</span></div></div>`).join('') +
    '</div><div class="hd"><h2 class="sec" id="eptitle"></h2><div><button id="markall" style="margin-right:8px">✓ Mark season watched</button><button id="resetprog" style="margin-right:8px">↺ Reset progress</button><button id="epToggle"></button></div></div><div id="eplist"></div>';
  const alive = () => document.getElementById('eps') && current && String(current.id) === String(id);
  const play = (s, e) => { playEpisode(s, e); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const mark = () => {
    box.querySelectorAll('.scard').forEach(c => { const n = +c.dataset.s; c.classList.toggle('sel', n === showS); c.classList.toggle('cur', n === current.s); });
    const cur = seasons.find(x => x.season_number === showS);
    document.getElementById('eptitle').textContent = cur ? cur.name : 'Episodes';
    document.getElementById('epToggle').textContent = epView === 'grid' ? 'Show dropdown' : 'Show episode grid';
  };
  const drawList = async () => {
    mark();
    const list = document.getElementById('eplist');
    list.innerHTML = '<p class="msg">Loading…</p>';
    let sd;
    try { sd = await api(`/tv/${id}/season/${showS}`); } catch (e) { sd = { episodes: [] }; }
    if (!alive()) return;
    const eps = sd.episodes || [];
    const ovHtml = sd.overview ? `<details class="sov"><summary>Season overview</summary><p dir="auto">${esc(sd.overview)}</p></details>` : '';
    if (!eps.length) { list.innerHTML = '<p class="msg">No episodes found for this season.</p>'; return; }
    
    document.getElementById('markall').onclick = () => {
      eps.forEach(x => setW(id, showS, x.episode_number, true));
      triggerConfetti();
      drawList();
    };

    if (epView === 'drop') {
      list.innerHTML = ovHtml + `<p class="meta">Select an episode</p><select id="epSel"><option value="">Choose an episode</option>${eps.map(x => `<option value="${x.episode_number}"${current.s === showS && current.e === x.episode_number ? ' selected' : ''}>${x.episode_number}. ${esc(x.name)}</option>`).join('')}</select>`;
      document.getElementById('epSel').onchange = ev => { if (ev.target.value) play(showS, +ev.target.value); };
      return;
    }
    const todayStr = new Date().toISOString().slice(0, 10);
    const todayDate = new Date(todayStr);

    list.innerHTML = ovHtml + '<div class="eplist">' + eps.map(x => {
      const aired = x.air_date && x.air_date <= todayStr;
      let badgeText = 'Aired';
      let badgeClass = 'ok';
      if (!aired && x.air_date) {
        const diffDays = Math.ceil((new Date(x.air_date) - todayDate) / (1000 * 60 * 60 * 24));
        badgeText = diffDays > 0 ? `Airing in ${diffDays}d` : 'Airing soon';
        badgeClass = 'wait';
      } else if (!x.air_date) {
        badgeText = 'TBA';
        badgeClass = 'wait';
      }

      const w = isW(id, showS, x.episode_number), ov = x.overview || '';
      return `<article class="epc${current.s === showS && current.e === x.episode_number ? ' cur' : ''}${aired ? '' : ' soon'}" data-e="${x.episode_number}">
        <div class="still">${x.still_path ? `<img loading="lazy" decoding="async" src="${IMG}w300${x.still_path}" alt="">` : ''}<span class="bdg ${badgeClass}">${badgeText}</span>${x.still_path ? `<button class="zoomb" aria-label="Zoom image" data-src="${IMG}w780${x.still_path}">⤢</button>` : ''}</div>
        <div class="eb"><h3 dir="auto">${x.episode_number}. ${esc(x.name)}</h3><p class="meta">${esc(x.air_date || 'TBA')}${x.runtime ? ' · ' + x.runtime + ' min' : ''}</p>
        <p class="ov" dir="auto">${esc(ov)}</p>${ov.length > 110 ? '<button class="more">See more</button>' : ''}
        <div class="ea"><button class="wbtn${w ? ' on' : ''}" aria-label="Mark as watched">✓</button></div></div></article>`;
    }).join('') + '</div>';
    list.querySelectorAll('.epc').forEach(c => {
      const n = +c.dataset.e;
      c.onclick = ev => { if (ev.target.closest('.more, .wbtn') || c.classList.contains('soon')) return; play(showS, n); };
      const zb = c.querySelector('.zoomb');
      if (zb) zb.onclick = ev => { ev.stopPropagation(); showStill(zb.dataset.src); };
      c.querySelector('.wbtn').onclick = ev => {
        ev.stopPropagation();
        const on = !ev.currentTarget.classList.contains('on');
        setW(id, showS, n, on); ev.currentTarget.classList.toggle('on', on);
        const allW = eps.every(ep => isW(id, showS, ep.episode_number));
        if (allW) triggerConfetti();
      };
      const mb = c.querySelector('.more');
      if (mb) mb.onclick = ev => {
        ev.stopPropagation();
        const o = c.querySelector('.ov'); o.classList.toggle('open');
        ev.currentTarget.textContent = o.classList.contains('open') ? 'See less' : 'See more';
      };
    });
  };
  box.querySelectorAll('.scard').forEach(c => { c.onclick = () => { showS = +c.dataset.s; drawList(); }; });
  document.getElementById('resetprog').onclick = () => {
    if (!confirm('Reset all watch progress for this series? It stays in your list.')) return;
    const w = getW(); delete w[id];
    try { localStorage.setItem('watched', JSON.stringify(w)); } catch (e) {}
    setCW(getCW().filter(x => String(x.id) !== String(id)));
    markDone('tv', id, false);
    drawList();
  };
  document.getElementById('epToggle').onclick = () => {
    epView = epView === 'grid' ? 'drop' : 'grid';
    try { localStorage.setItem('epview', epView); } catch (e) {}
    drawList();
  };
  epRedraw = () => { if (alive()) { showS = current.s; drawList(); } };
  drawList();
}

function playEpisode(s, e) {
  clearInterval(nextTimer);
  const nx = document.getElementById('next'); if (nx) nx.innerHTML = '';
  current.s = s; current.e = e;
  party.lastTime = 0;
  const partyHash = (party.active && party.roomId) ? `?party=${encodeURIComponent(party.roomId)}&prov=${encodeURIComponent(playerProv)}` : '';
  history.replaceState(null, '', location.pathname + location.search + `#tv/${current.id}/${s}/${e}${partyHash}`);
  const en = document.getElementById('epnow'); if (en) en.textContent = `Now playing: S${s} E${e}`;
  document.getElementById('frame').src = getEmbedUrl(playerProv, current.type, current.id, s, e, 0);
  if (epRedraw) epRedraw();
  if (party.active && party.role === 'host') broadcastPartyState(true);
}

async function nextUp() {
  if (!current || current.type !== 'tv') return;
  try {
    const sd = await api(`/tv/${current.id}/season/${current.s}`);
    let s = current.s, e = current.e + 1;
    if (e > sd.episodes.length) { s++; e = 1; if (current.seasons && s > current.seasons) { markDone('tv', current.id); return; } }
    showNext(s, e);
  } catch (err) {}
}

function showNext(s, e) {
  const box = document.getElementById('next'); if (!box) return;
  let n = getNS();
  clearInterval(nextTimer);
  const paint = () => {
    box.innerHTML = `<div class="nextup"><span>Next up: S${s} E${e}${n > 0 ? '. Playing in ' + n + 's' : ''}</span><button id="nplay">Play now</button><button id="ncancel">Cancel</button></div>`;
    document.getElementById('nplay').onclick = () => playEpisode(s, e);
    document.getElementById('ncancel').onclick = () => { clearInterval(nextTimer); box.innerHTML = ''; };
  };
  paint();
  if (n <= 0) return;
  nextTimer = setInterval(() => {
    if (!current || !document.getElementById('next')) return clearInterval(nextTimer);
    if (--n <= 0) return playEpisode(s, e);
    paint();
  }, 1000);
}

async function checkUpdate(manual) {
  const say = t => { const m = document.getElementById('upmsg'); if (m) m.textContent = t; };
  if (location.protocol === 'file:') { if (manual) say('Updates only work on the hosted version.'); return; }
  lastCheck = Date.now();
  try {
    const r = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/APP_VERSION = '(\d+)'/);
    if (m && m[1] !== APP_VERSION) { if (manual) say('New version found.'); return showUpdate(m[1]); }
    if (manual) say('You have the latest version.');
  } catch (e) { if (manual) say('Could not check. Are you online?'); }
}

function showUpdate(v) {
  if (document.getElementById('upd')) return;
  const b = document.createElement('div');
  b.id = 'upd'; b.className = 'upd';
  b.innerHTML = 'A new version of Screenroom is ready. <button id="uprel">Update now</button>';
  document.body.insertBefore(b, document.body.firstChild);
  document.getElementById('uprel').onclick = () => { location.href = location.pathname + '?v=' + v; };
}

async function loadSimilar(type, id) {
  try {
    const d = await api(`/${type}/${id}/recommendations`);
    const l = d.results.filter(i => i.poster_path).slice(0, 8);
    const box = document.getElementById('sim');
    if (!l.length || !box || !current || String(current.id) !== String(id)) return;
    box.innerHTML = '<h2 class="sec">Similar titles</h2><div class="grid sm">' + l.map(i => `<div class="card" tabindex="0" data-type="${type}" data-id="${i.id}">
      <img loading="lazy" decoding="async" src="${IMG}w342${i.poster_path}" alt="${esc(i.title || i.name)}">
      <div>${esc(i.title || i.name)}</div></div>`).join('') + '</div>';
    bindCards();
  } catch (e) {}
}

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); q.focus(); q.select(); }
  else if ((e.key === '?' || (e.key === '/' && e.shiftKey)) && !typing) { e.preventDefault(); showShortcutsModal(); }
  else if (e.key === 'Escape') { if (document.body.classList.contains('theater')) exitTheater(); else if (typing) document.activeElement.blur(); else if (navStack.length > 0 || current) backBtn.click(); }
  else if (e.key.toLowerCase() === 'f' && !typing) {
    const pl = document.querySelector('.player');
    if (!pl) return;
    if (document.fullscreenElement) document.exitFullscreen(); else if (pl.requestFullscreen) pl.requestFullscreen();
  }
});

document.getElementById('texit').onclick = () => {
  if (document.body.classList.contains('thide')) return showTheaterUI();
  if (history.state && history.state.theater) history.back(); else exitTheater();
};
document.getElementById('tnext').onclick = () => { showTheaterUI(); nextEpisodeNow(); };
document.getElementById('tchat-btn').onclick = () => {
  showTheaterUI();
  party.theaterChatOpen = !party.theaterChatOpen;
  if (party.theaterChatOpen) party.unread = 0;
  const cb = document.getElementById('party-chat');
  if (cb) cb.classList.toggle('t-open', party.theaterChatOpen);
  updateTheaterChatBtn();
  if (party.theaterChatOpen) {
    renderChatMessages();
    const inp = document.getElementById('chat-input');
    if (inp) inp.focus();
  }
};
window.addEventListener('popstate', () => { if (document.body.classList.contains('theater')) exitTheater(); });

backBtn.onclick = () => {
  clearInterval(nextTimer);
  const prev = navStack.pop();
  if (!prev) {
    current = null;
    home(true);
    return;
  }
  if (prev.kind === 'watch') {
    watch(prev.type, prev.id, prev.res || {}, true);
  } else if (prev.kind === 'person') {
    loadPersonCredits(prev.pid, true);
  } else if (prev.kind === 'search') {
    q.value = prev.query || '';
    q.dispatchEvent(new Event('input'));
  } else {
    tab = prev.tab || 'all';
    if (prev.filt) filt = { ...prev.filt };
    home(true);
  }
};

document.getElementById('home').onclick = () => { navStack = []; current = null; tab = 'all'; home(); };
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { navStack = []; current = null; tab = b.dataset.tab; filt = { genre: '', year: '', sort: 'popular', minVote: '', minRating: '' }; home(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastCheck > 600000) checkUpdate(false); });
let seenV = '';
try { seenV = localStorage.getItem('seen') || ''; } catch (e) {}
if (seenV !== APP_VERSION) { if (key) showPatchNotes(); else { try { localStorage.setItem('seen', APP_VERSION); } catch (e) {} } }
checkUpdate(false);
async function handleDiscordAuth() {
  const hash = window.location.hash;
  if (hash.includes('access_token=')) {
    const params = new URLSearchParams(hash.substring(1));
    const accessToken = params.get('access_token');
    if (accessToken) {
      try {
        const res = await fetch('https://discord.com/api/users/@me', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        if (res.ok) {
          const user = await res.json();
          const username = user.global_name || user.username || 'Discord User';
          const defaultIdx = user.discriminator && user.discriminator !== '0'
            ? (Number(user.discriminator) % 5)
            : Number((BigInt(user.id || '0') >> 22n) % 6n);
          const avatarUrl = user.avatar
            ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`
            : `https://cdn.discordapp.com/embed/avatars/${defaultIdx}.png`;
          try { localStorage.setItem('sr_discord_profile', JSON.stringify({ id: user.id, name: username, pfp: avatarUrl })); } catch (e) {}
          if (!key) {
            key = '5d0979bf39cd11dbb4d24177b8b4b76c';
            try { localStorage.setItem('tmdb_key', key); } catch (e) {}
          }
          saveUserProfile(username, avatarUrl);
        }
      } catch (e) {}
      history.replaceState(null, '', location.pathname + location.search);
    }
  }
}

const hm = location.hash.match(/^#(movie|tv)\/(\d+)(?:\/(\d+)\/(\d+))?(?:\?(.*))?$/);
if (key) syncProfileFromTmdbAccount();
loadBlocked().then(async () => {
  await handleDiscordAuth();
  if (hm) {
    const [, mType, mId, mS, mE, mQuery] = hm;
    const qp = new URLSearchParams(mQuery || '');
    const partyRoom = qp.get('party');
    const provParam = qp.get('prov');
    if (provParam && ['vidyst', 'multiembed', 'vidsrc'].includes(provParam)) playerProv = provParam;
    if (!key && partyRoom) key = '5d0979bf39cd11dbb4d24177b8b4b76c';
    if (key) {
      watch(mType, mId, { s: +(mS || 1), e: +(mE || 1), t: Math.max(0, +qp.get('t') || 0) }).then(() => {
        if (partyRoom) joinWatchParty(partyRoom);
      });
      return;
    }
  }
  home();
});
