<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screenroom</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://api.themoviedb.org">
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="preconnect" href="https://vidy.st">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#141922">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Screenroom">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#141922;--surface:#1e2532;--line:#2c3547;--text:#ece9e2;--muted:#8d97a8;--accent:#ff7a45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:calc(12px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 10px max(20px,env(safe-area-inset-left));border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font:700 22px Georgia,serif;cursor:pointer;white-space:nowrap}
.logo span{color:var(--accent)}
#q{flex:1 1 180px;min-width:0;max-width:520px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:16px}
#back{display:none;padding:8px 12px}
nav{display:flex;gap:6px}
nav button{border-color:transparent;background:transparent;color:var(--muted)}
nav button.on{color:var(--text);border-color:var(--accent)}
#q:focus,button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:20px max(20px,env(safe-area-inset-right)) 40px max(20px,env(safe-area-inset-left));max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:var(--surface);border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid var(--line)}
.card:hover{border-color:var(--accent)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222a39}
.card div{padding:8px 10px;font-size:14px}
.card small{color:var(--muted);display:block}
.card{position:relative}
.card .prog{height:3px;padding:0;background:var(--line)}
.x{position:absolute;top:6px;right:6px;width:30px;height:30px;padding:0;border-radius:50%;background:rgba(20,25,34,.85);font-size:18px;line-height:1}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.filters select,.filters input{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;min-width:0}
.filters input{width:100px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.sim{margin-top:24px}
.sk{background:var(--surface);border-radius:8px;aspect-ratio:2/3;animation:pulse 1.2s ease-in-out infinite}
.player.sk{aspect-ratio:16/9;border-radius:10px;background:var(--surface)}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.empty{text-align:center;padding:48px 0}
.empty i{display:block;width:64px;height:92px;margin:0 auto 16px;border:2px dashed var(--line);border-radius:8px}
.hint{display:none;text-align:center;color:var(--muted);font-size:13px;padding:0 0 24px}
@media (hover:hover) and (pointer:fine){.hint{display:block}}
.upd{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--accent);color:#141922;font-weight:600;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;text-align:center}
.upd button{background:#141922;color:var(--text);border:0}
.nextup{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.nextup span{flex:1 1 160px}
.rt{position:absolute;top:6px;left:6px;background:rgba(20,25,34,.85);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
#lang{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;margin:0 0 12px}
.attr{text-align:center;color:var(--muted);font-size:12px;padding:0 20px calc(24px + env(safe-area-inset-bottom))}
.bk{display:flex;gap:10px;flex-wrap:wrap}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hd h2{margin:0}
#fav.on{color:var(--accent);border-color:var(--accent)}
.prog i{display:block;height:100%;background:var(--accent)}
.msg{color:var(--muted);padding:40px 0;text-align:center}
.player{aspect-ratio:16/9;width:100%;background:#000;border-radius:10px;overflow:hidden}
.player iframe{width:100%;height:100%;border:0}
button{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:15px;cursor:pointer}
button:hover{border-color:var(--accent)}
h2{margin:18px 0 6px;font:700 26px Georgia,serif}
h2.sec{margin:0 0 12px;font-size:21px}
.row{margin-bottom:28px}
.meta{color:var(--muted);margin:0 0 10px}
.ep{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
.ep input{width:70px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px}
.setup{max-width:480px;margin:60px auto;text-align:center}
.setup input{width:100%;padding:12px;margin:14px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
@media (max-width:600px){nav{order:3;width:100%}}
/* Landscape phones: compact header, player beside the details */
@media (orientation:landscape) and (max-height:600px){
  header{position:static;padding-top:6px;padding-bottom:6px}
  .logo{font-size:18px}
  nav{order:0;width:auto}
  main{padding-top:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .watch{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
  .watch .player{position:sticky;top:8px}
  .watch h2{margin-top:0;font-size:20px}
  .icol{max-height:calc(100vh - 80px);overflow:auto}
}
/* Design pass */
.card{transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px)}
main>*{animation:fade .25s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.card,main>*{transition:none;animation:none}.card:hover{transform:none}}
/* Patch notes */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:20px}
.pn{margin:0 0 18px}
.pn h3{margin:0 0 6px;font:700 18px Georgia,serif}
.pn ul{margin:0;padding-left:20px}
.pn li{margin:3px 0}
.pn.old{opacity:.7}
/* Theater mode: in-page full screen, keeps our controls (iPhone friendly) */
#texit{display:none}
body.theater{overflow:hidden}
body.theater .player{position:fixed;inset:0;z-index:50;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0;background:#000;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.theater #texit{display:block;position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));z-index:70;opacity:.6;border-radius:50%;width:38px;height:38px;padding:0;font-size:18px;line-height:1;background:rgba(20,25,34,.8)}
#texit{transition:opacity .3s}
body.theater.thide #texit{opacity:0}
#tnext{display:none}
body.theater.tv #tnext{display:block;position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(58px + env(safe-area-inset-left));z-index:70;opacity:.8;background:rgba(20,25,34,.8);transition:opacity .3s}
body.theater.thide #tnext{opacity:0;pointer-events:none}
body.theater #next{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;width:min(92vw,460px)}
</style>
</head>
<body>
<header>
  <button id="back" aria-label="Back">←</button>
  <div class="logo" id="home">Screen<span>room</span></div>
  <nav id="nav">
    <button data-tab="all" class="on">Home</button>
    <button data-tab="movie">Movies</button>
    <button data-tab="tv">Series</button>
    <button data-tab="list">My list</button>
  </nav>
  <input id="q" type="search" placeholder="Search a movie or show…" title="Press / to search" autocomplete="off">
</header>
<button id="texit" aria-label="Exit theater mode">✕</button>
<button id="tnext">Next ▶</button>
<main id="app"></main>
<p class="hint">Press / to search, F for fullscreen, Esc to go back.</p>
<p class="attr">This product uses the TMDB API but is not endorsed or certified by TMDB.</p>

<script>
const APP_VERSION = '16';
const IMG = 'https://image.tmdb.org/t/p/';
const app = document.getElementById('app');
const q = document.getElementById('q');
const backBtn = document.getElementById('back');
let key = '', tab = 'all', current = null, lastSave = 0, filt = { genre: '', year: '', sort: 'popular' }, genres = {}, nextTimer = null, lastCheck = 0, lang = 'en-US';
try { key = localStorage.getItem('tmdb_key') || ''; lang = localStorage.getItem('lang') || 'en-US'; } catch (e) {}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] || c));
const cache = new Map();
const api = (path, params = '') => {
  const url = `https://api.themoviedb.org/3${path}?api_key=${key}&language=${lang}${params}`;
  const hit = cache.get(url);
  if (hit && Date.now() - hit.t < 600000) return hit.p;
  const p = fetch(url).then(r => {
    if (!r.ok) throw new Error(r.status === 401 ? 'Invalid TMDB API key.' : 'TMDB error ' + r.status);
    return r.json();
  });
  cache.set(url, { t: Date.now(), p });
  p.catch(() => cache.delete(url));
  return p;
};
const skel = (n = 12) => '<div class="grid">' + '<div class="sk"></div>'.repeat(n) + '</div>';
const emptyState = (t, h) => `<div class="empty"><i></i><h2 class="sec">${t}</h2><p class="meta">${h}</p></div>`;
const clearHash = () => { document.body.classList.remove('theater', 'thide'); if (location.hash) history.replaceState(null, '', location.pathname + location.search); };
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

/* ---- Continue watching (stored in this browser) ---- */
const getCW = () => { try { return JSON.parse(localStorage.getItem('cw') || '[]'); } catch (e) { return []; } };
const setCW = l => { try { localStorage.setItem('cw', JSON.stringify(l.slice(0, 20))); } catch (e) {} };
function saveProgress(t, dur, done) {
  if (!current) return;
  let l = getCW().filter(x => !(x.type === current.type && x.id === current.id));
  if (!done && t > 10 && dur > 0 && t / dur < 0.95) l.unshift({ ...current, time: Math.floor(t), dur: Math.floor(dur) });
  else if (!done) l = getCW();
  setCW(l);
}
window.addEventListener('message', ev => {
  const f = document.getElementById('frame');
  if (!f || ev.source !== f.contentWindow) return;
  let p = ev.data;
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { return; } }
  if (!p || !p.event) return;
  const now = Date.now();
  if (p.event === 'ended') { saveProgress(0, 0, true); nextUp(); }
  else if (p.event === 'pause' || (p.event === 'timeupdate' && now - lastSave > 5000)) {
    lastSave = now; saveProgress(p.currentTime || 0, p.duration || 0, false);
  }
});

/* ---- My list + history ---- */
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const same = (a, type, id) => a.type === type && String(a.id) === String(id);
const isFav = (type, id) => lsGet('fav').some(x => same(x, type, id));
function toggleFav(it) {
  let l = lsGet('fav'); const has = l.some(x => same(x, it.type, it.id));
  l = has ? l.filter(x => !same(x, it.type, it.id)) : [{ type: it.type, id: it.id, name: it.name, poster: it.poster }, ...l];
  lsSet('fav', l); return !has;
}
function addHist(it) {
  const l = lsGet('hist').filter(x => !same(x, it.type, it.id));
  l.unshift({ type: it.type, id: it.id, name: it.name, poster: it.poster });
  lsSet('hist', l.slice(0, 40));
}

/* ---- Views ---- */
function showSetup(err) {
  backBtn.style.display = 'none'; clearHash();
  app.innerHTML = `<div class="setup">
    <h2>Add your TMDB key</h2>
    <p class="meta">Screenroom uses TMDB for search and posters. Get a free API key (v3) at themoviedb.org → Settings → API.</p>
    ${err ? `<p style="color:#ff8a8a">${esc(err)}</p>` : ''}
    <input id="k" placeholder="Paste your TMDB API key">
    <button id="save">Save key</button>
    <p class="meta">Already have a backup from another device?</p>
    <button id="imp">Import backup</button><input id="impf" type="file" accept=".json,application/json" hidden></div>`;
  bindBackup();
  document.getElementById('save').onclick = () => {
    key = document.getElementById('k').value.trim();
    try { localStorage.setItem('tmdb_key', key); } catch (e) {}
    home();
  };
}

async function home() {
  if (!key) return showSetup();
  q.value = '';
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'list') return listView();
  app.innerHTML = skel();
  try {
    const mt = tab === 'movie' || tab === 'tv';
    const gp = (mt && !genres[tab]) ? api(`/genre/${tab}/list`).then(r => r.genres).catch(() => []) : null;
    const filtered = mt && (filt.genre || filt.year || filt.sort !== 'popular');
    const sorts = { popular: 'popularity.desc', top: 'vote_average.desc', new: tab === 'movie' ? 'primary_release_date.desc' : 'first_air_date.desc' };
    let pr = '&sort_by=' + sorts[filt.sort] + '&vote_count.gte=' + (filt.sort === 'top' ? 300 : filt.sort === 'new' ? 5 : 20);
    if (filt.sort === 'new') pr += (tab === 'movie' ? '&primary_release_date.lte=' : '&first_air_date.lte=') + new Date().toISOString().slice(0, 10);
    if (filt.genre) pr += '&with_genres=' + filt.genre;
    if (filt.year) pr += (tab === 'movie' ? '&primary_release_year=' : '&first_air_date_year=') + filt.year;
    const dp = filtered ? api(`/discover/${tab}`, pr) : api(`/trending/${tab}/week`);
    if (gp) genres[tab] = await gp;
    const d = await dp;
    const names = { all: 'Trending this week', movie: 'Trending movies', tv: 'Trending series' };
    render(d.results, filtered ? 'Filtered results' : names[tab], true);
  } catch (e) { showSetup(e.message); }
}

function cwRow() {
  const l = getCW().filter(x => tab === 'all' || x.type === tab);
  if (!l.length) return '';
  return `<div class="row"><h2 class="sec">Continue watching</h2><div class="grid">` + l.map(x => `
    <div class="card" tabindex="0" data-type="${x.type}" data-id="${x.id}" data-s="${x.s}" data-e="${x.e}" data-t="${x.time}">
      <button class="x" aria-label="Remove from continue watching">×</button>
      <img loading="lazy" decoding="async" src="${IMG}w342${x.poster}" alt="${esc(x.name)}">
      <div class="prog"><i style="width:${Math.round(100 * x.time / x.dur)}%"></i></div>
      <div>${esc(x.name)}<small>${x.type === 'tv' ? `S${x.s} E${x.e} · ` : ''}${fmt(x.time)}</small></div></div>`).join('') + '</div></div>';
}

function render(items, title, withCW) {
  backBtn.style.display = 'none'; clearHash();
  items = items.filter(i => i.media_type !== 'person' && i.poster_path);
  const cw = withCW ? cwRow() : '';
  const bar = withCW ? filterBar() : '';
  if (!items.length && !cw) { app.innerHTML = bar + emptyState('No titles found', 'Try a different spelling, or clear the filters.'); bindFilters(); return; }
  app.innerHTML = bar + cw + `<div class="hd"><h2 class="sec">${esc(title)}</h2>${withCW ? '<button id="sur">Surprise me</button>' : ''}</div><div class="grid">` + items.map(i => {
    const type = i.media_type || ((tab === 'movie' || tab === 'tv') ? tab : (i.title ? 'movie' : 'tv'));
    const name = i.title || i.name;
    const year = (i.release_date || i.first_air_date || '').slice(0, 4);
    return `<div class="card" tabindex="0" data-type="${type}" data-id="${i.id}">
      ${i.vote_average > 0 ? `<b class="rt">★ ${i.vote_average.toFixed(1)}</b>` : ''}
      <img loading="lazy" decoding="async" src="${IMG}w342${i.poster_path}" alt="${esc(name)}">
      <div>${esc(name)}<small>${type === 'tv' ? 'Series' : 'Movie'}${year ? ' · ' + year : ''}</small></div></div>`;
  }).join('') + '</div>';
  bindCards();
  bindFilters();
  const sb = document.getElementById('sur'); if (sb) sb.onclick = surprise;
}

async function surprise() {
  const sb = document.getElementById('sur');
  if (sb) { sb.disabled = true; sb.textContent = 'Picking…'; }
  try {
    const type = (tab === 'movie' || tab === 'tv') ? tab : (Math.random() < 0.5 ? 'movie' : 'tv');
    let pr = '&sort_by=popularity.desc&vote_count.gte=500&vote_average.gte=6.5&page=' + (1 + Math.floor(Math.random() * 10));
    if (tab === type && filt.genre) pr += '&with_genres=' + filt.genre;
    if (tab === type && filt.year) pr += (type === 'movie' ? '&primary_release_year=' : '&first_air_date_year=') + filt.year;
    const l = (await api(`/discover/${type}`, pr)).results.filter(i => i.poster_path);
    if (!l.length) throw new Error('none');
    watch(type, l[Math.floor(Math.random() * l.length)].id);
  } catch (e) { if (sb) { sb.disabled = false; sb.textContent = 'Surprise me'; } }
}

function filterBar() {
  if (tab !== 'movie' && tab !== 'tv') return '';
  const sortOpts = [['popular', 'Popular'], ['top', 'Top rated'], ['new', 'Newest']].map(([v, n]) => `<option value="${v}"${filt.sort === v ? ' selected' : ''}>${n}</option>`).join('');
  const opts = (genres[tab] || []).map(g => `<option value="${g.id}"${String(g.id) === filt.genre ? ' selected' : ''}>${esc(g.name)}</option>`).join('');
  return `<div class="filters"><select id="fg" aria-label="Genre"><option value="">All genres</option>${opts}</select>
    <select id="fs" aria-label="Sort">${sortOpts}</select>
    <input id="fy" type="number" min="1900" max="2100" placeholder="Year" value="${esc(filt.year)}" aria-label="Year">
    ${filt.genre || filt.year || filt.sort !== 'popular' ? '<button id="fc">Clear</button>' : ''}</div>`;
}

function bindFilters() {
  const g = document.getElementById('fg'); if (!g) return;
  g.onchange = () => { filt.genre = g.value; home(); };
  document.getElementById('fs').onchange = ev => { filt.sort = ev.target.value; home(); };
  document.getElementById('fy').onchange = ev => { filt.year = ev.target.value.trim(); home(); };
  const c = document.getElementById('fc'); if (c) c.onclick = () => { filt = { genre: '', year: '', sort: 'popular' }; home(); };
}

function bindCards() {
  app.querySelectorAll('.card').forEach(c => {
    const go = () => watch(c.dataset.type, c.dataset.id, { s: +c.dataset.s || 1, e: +c.dataset.e || 1, t: +c.dataset.t || 0 });
    c.onclick = go;
    c.addEventListener('pointerdown', () => { if (c.dataset.id) api(`/${c.dataset.type}/${c.dataset.id}`).catch(() => {}); }, { passive: true });
    c.onkeydown = e => { if (e.key === 'Enter' && e.target === c) go(); };
  });
  app.querySelectorAll('.x').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const c = b.closest('.card'), row = c.closest('.row');
    setCW(getCW().filter(x => !same(x, c.dataset.type, c.dataset.id)));
    c.remove();
    if (!row.querySelector('.card')) row.remove();
  });
}

function backupBox() {
  return `<div class="row"><h2 class="sec">Backup</h2>
    <p class="meta">Move your list, history and progress to another device. The file also contains your TMDB key, so keep it private.</p>
    <div class="bk"><button id="exp">Export backup</button><button id="imp">Import backup</button></div>
    <input id="impf" type="file" accept=".json,application/json" hidden>
    <p id="bkmsg" class="meta"></p></div>
    <div class="row"><h2 class="sec">App</h2><p class="meta">Language of titles and descriptions</p><select id="lang">${[['en-US', 'English'], ['fr-FR', 'Français'], ['ar-SA', 'العربية'], ['es-ES', 'Español']].map(([v, n]) => `<option value="${v}"${lang === v ? ' selected' : ''}>${n}</option>`).join('')}</select>
    <p class="meta">Version ${APP_VERSION}. <span id="upmsg"></span></p><button id="upchk">Check for updates</button> <button id="shareapp">Share this app</button> <button id="pnbtn">Patch notes</button></div>`;
}

function bindBackup() {
  const exp = document.getElementById('exp'), imp = document.getElementById('imp'), f = document.getElementById('impf');
  const ls = document.getElementById('lang');
  if (ls) ls.onchange = () => { lang = ls.value; try { localStorage.setItem('lang', lang); } catch (e) {} genres = {}; const m = document.getElementById('bkmsg'); if (m) m.textContent = 'Language saved. It applies to the next page you open.'; };
  const pb = document.getElementById('pnbtn');
  if (pb) pb.onclick = showPatchNotes;
  const sa = document.getElementById('shareapp');
  if (sa) sa.onclick = async () => {
    const url = location.origin + location.pathname;
    try {
      if (navigator.share) await navigator.share({ title: 'Screenroom', url });
      else { await navigator.clipboard.writeText(url); sa.textContent = 'Link copied'; }
    } catch (e) {}
  };
  const uc = document.getElementById('upchk'); if (uc) uc.onclick = () => checkUpdate(true);
  const say = t => { const m = document.getElementById('bkmsg'); if (m) m.textContent = t; };
  if (exp) exp.onclick = () => {
    const data = { app: 'screenroom', v: 1, key, fav: lsGet('fav'), hist: lsGet('hist'), cw: getCW() };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
    a.download = 'screenroom-backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    say('Backup created. Check your downloads.');
  };
  if (imp && f) {
    imp.onclick = () => f.click();
    f.onchange = async () => {
      try {
        const d = JSON.parse(await f.files[0].text());
        if (d.app !== 'screenroom') throw new Error('bad file');
        const merge = (k, inc, prefer) => {
          const out = lsGet(k);
          (Array.isArray(inc) ? inc : []).filter(x => x && x.type && x.id).forEach(a => {
            const i = out.findIndex(c => same(c, a.type, a.id));
            if (i < 0) out.push(a); else if (prefer) out[i] = a;
          });
          lsSet(k, out);
        };
        merge('fav', d.fav, false); merge('hist', d.hist, false); merge('cw', d.cw, true);
        if (d.key && !key) { key = String(d.key); try { localStorage.setItem('tmdb_key', key); } catch (e) {} }
        if (tab === 'list') listView(); else if (key) home();
        say('Backup imported.');
      } catch (e) { say('That file is not a Screenroom backup.'); }
      f.value = '';
    };
  }
}

function listView() {
  if (!key) return showSetup();
  backBtn.style.display = 'none'; clearHash();
  const sec = (title, l, extra = '') => l.length ? `<div class="row"><div class="hd"><h2 class="sec">${title}</h2>${extra}</div><div class="grid">` +
    l.filter(x => x.poster).map(x => `<div class="card" tabindex="0" data-type="${x.type}" data-id="${x.id}">
      <img loading="lazy" decoding="async" src="${IMG}w342${x.poster}" alt="${esc(x.name)}">
      <div>${esc(x.name)}<small>${x.type === 'tv' ? 'Series' : 'Movie'}</small></div></div>`).join('') + '</div></div>' : '';
  const body = sec('Favorites', lsGet('fav')) + sec('History', lsGet('hist'), '<button id="clr">Clear history</button>')
    || emptyState('Your list is empty', 'Open a title and tap “♡ Add to my list” to keep it here.');
  app.innerHTML = body + backupBox();
  bindCards();
  bindBackup();
  const clr = document.getElementById('clr');
  if (clr) clr.onclick = () => { lsSet('hist', []); listView(); };
}

let timer;
q.addEventListener('input', () => {
  clearTimeout(timer);
  const v = q.value.trim();
  if (!key) return showSetup();
  if (!v) return home();
  timer = setTimeout(async () => {
    try {
      const ep = (tab === 'all' || tab === 'list') ? 'multi' : tab;
      const d = await api('/search/' + ep, '&query=' + encodeURIComponent(v));
      render(d.results, `Results for “${v}”`, false);
    } catch (e) { app.innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
  }, 350);
});

function embedUrl(type, id, s, e, t) {
  const prog = t > 0 ? `&progress=${t}` : '';
  return type === 'movie'
    ? `https://vidy.st/movie/${id}?color=FF7A45${prog}`
    : `https://vidy.st/tv/${id}/${s}/${e}?color=FF7A45&nextEpisode=true&episodeSelector=true${prog}`;
}

async function watch(type, id, res = {}) {
  if (!key) return showSetup();
  clearInterval(nextTimer);
  app.innerHTML = '<div class="player sk"></div>';
  try {
    const d = await api(`/${type}/${id}`);
    const name = d.title || d.name;
    const year = (d.release_date || d.first_air_date || '').slice(0, 4);
    const mins = type === 'movie' ? d.runtime : (d.episode_run_time && d.episode_run_time[0]);
    const dur = mins ? (mins >= 60 ? Math.floor(mins / 60) + 'h' + (mins % 60 ? ' ' + (mins % 60) + 'm' : '') : mins + 'm') : '';
    const seasonsTxt = type === 'tv' && d.number_of_seasons ? ` · ${d.number_of_seasons} season${d.number_of_seasons > 1 ? 's' : ''}` : '';
    const s = res.s || 1, e = res.e || 1, t = res.t || 0;
    current = { type, id, name, poster: d.poster_path, s, e, seasons: d.number_of_seasons };
    addHist(current);
    document.body.classList.toggle('tv', type === 'tv');
    history.replaceState(null, '', location.pathname + location.search + '#' + type + '/' + id);
    backBtn.style.display = 'block';
    app.innerHTML = `<div class="watch">
      <div class="player"><iframe id="frame" allowfullscreen
        allow="encrypted-media; autoplay *; fullscreen *"
        src="${embedUrl(type, id, s, e, t)}"></iframe></div>
      <div class="icol">
        <div id="next"></div>
        <h2 dir="auto">${esc(name)}</h2>
        <p class="meta">${type === 'tv' ? 'Series' : 'Movie'}${year ? ' · ' + year : ''}${dur ? ' · ' + dur : ''}${seasonsTxt}${d.vote_average ? ' · ★ ' + d.vote_average.toFixed(1) : ''}</p>
        <div class="chips">${(d.genres || []).map(g => `<span>${esc(g.name)}</span>`).join('')}</div>
        <button id="fav" class="${isFav(type, id) ? 'on' : ''}">${isFav(type, id) ? '♥ In my list' : '♡ Add to my list'}</button> <button id="share">Share</button> <button id="dl">Download</button> <button id="theater">Theater mode</button>
        ${type === 'tv' ? `<div class="ep">Season <input id="s" type="number" min="1" value="${s}"> Episode <input id="e" type="number" min="1" value="${e}"> <button id="go">Play</button> <button id="nextep">Next ▶</button></div>` : ''}
        <p dir="auto">${esc(d.overview)}</p>
        <div class="sim" id="sim"></div>
      </div></div>`;
    document.getElementById('theater').onclick = enterTheater;
    document.getElementById('dl').onclick = () => showDownloadModal(type, id, current.s, current.e, name);
    document.getElementById('share').onclick = async ev => {
      const url = location.href;
      try {
        if (navigator.share) await navigator.share({ title: name, url });
        else { await navigator.clipboard.writeText(url); ev.target.textContent = 'Link copied'; setTimeout(() => { ev.target.textContent = 'Share'; }, 2000); }
      } catch (e) {}
    };
    loadSimilar(type, id);
    document.getElementById('fav').onclick = ev => {
      const on = toggleFav(current);
      ev.target.classList.toggle('on', on);
      ev.target.textContent = on ? '♥ In my list' : '♡ Add to my list';
    };
    if (type === 'tv') document.getElementById('nextep').onclick = nextEpisodeNow;
    if (type === 'tv') document.getElementById('go').onclick = () => {
      current.s = +document.getElementById('s').value || 1;
      current.e = +document.getElementById('e').value || 1;
      document.getElementById('frame').src = embedUrl(type, id, current.s, current.e, 0);
    };
  } catch (err) { app.innerHTML = `<p class="msg">${esc(err.message)}</p>`; }
}

function showDownloadModal(type, id, s, e, name) {
  if (document.getElementById('dlm')) return;
  const cleanName = name.replace(/[<>:"/\|?*]+/g, '').trim() + (type === 'tv' ? `_S${s}E${e}` : '');
  const filename = `${cleanName}.mp4`;
  const cmd = `$videoUrl = "PUT_YOUR_M3U8_URL_HERE"; $exe = "$HOME\yt-dlp.exe"; if(!(Test-Path $exe)){ Write-Host "Downloading yt-dlp..." -ForegroundColor Cyan; Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile $exe }; try { & $exe --referer "https://vidy.st/" --add-header "Origin: https://vidy.st" --hls-prefer-native -o "${filename}" $videoUrl } catch { Write-Host "\`n[!] Download error: If you get HTTP Error 502 Bad Gateway or 403 Forbidden, your .m3u8 token expired. Refresh the video page and regrab a fresh stream link!" -ForegroundColor Red }`;

  const m = document.createElement('div');
  m.id = 'dlm'; m.className = 'modal';
  m.innerHTML = `<div class="box" role="dialog" aria-label="Download options">
    <h2 class="sec">Download Title</h2>
    <p class="meta">Target: <b>${esc(name)}</b> ${type === 'tv' ? `(S${s} E${e})` : ''}</p>
    
    <div style="margin-bottom:14px">
      <p class="meta" style="margin-bottom:6px"><b>1. Paste & Run in PowerShell</b> (Auto-fetches yt-dlp):</p>
      <textarea readonly style="width:100%;height:115px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:monospace;font-size:12px;resize:none">${esc(cmd)}</textarea>
      <button id="dlcopy" style="margin-top:8px">Copy command</button>
    </div>

    <div style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px;font-size:14px">
      <p style="margin:0 0 6px;color:var(--accent);font-weight:600">⚠️ Common Download Errors & Solutions:</p>
      <ul style="margin:0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.4">
        <li><b>HTTP Error 502 (Bad Gateway) / 403 (Forbidden):</b> The .m3u8 token expired! Simply refresh the video page on Screenroom and regrab a fresh link.</li>
        <li><b>Path or command errors:</b> This command auto-downloads <code>yt-dlp.exe</code> directly into your User folder (<code>$HOME\yt-dlp.exe</code>) so no system setup is required.</li>
      </ul>
    </div>

    <div style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:16px;font-size:14px">
      <p style="margin:0 0 6px;color:var(--accent);font-weight:600">⚡ Want 1-click .m3u8 link sniffing?</p>
      <p style="margin:0 0 8px;color:var(--muted)">Install a browser extension like <b>HLS Downloader</b> or <b>Simple Media Sniffer</b>. When playing the video inside Screenroom, the extension will automatically detect and list the direct stream link without opening Developer Tools!</p>
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button id="dlclose">Close</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  document.getElementById('dlclose').onclick = close;
  document.getElementById('dlcopy').onclick = async () => {
    try {
      await navigator.clipboard.writeText(cmd);
      const btn = document.getElementById('dlcopy');
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy command'; }, 2000);
    } catch (e) {}
  };
  m.onclick = ev => { if (ev.target === m) close(); };
}

let tTimer;
function showTheaterUI() {
  document.body.classList.remove('thide');
  clearTimeout(tTimer);
  tTimer = setTimeout(() => document.body.classList.add('thide'), 3000);
}
function enterTheater() {
  document.body.classList.add('theater');
  history.pushState({ theater: 1 }, '');
  showTheaterUI();
}
function exitTheater() {
  document.body.classList.remove('theater', 'thide');
  clearTimeout(tTimer);
}

async function nextEpisodeNow() {
  if (!current || current.type !== 'tv') return;
  try {
    const sd = await api(`/tv/${current.id}/season/${current.s}`);
    let s = current.s, e = current.e + 1;
    if (e > sd.episodes.length) { s++; e = 1; if (current.seasons && s > current.seasons) return; }
    playEpisode(s, e);
  } catch (err) {}
}

function playEpisode(s, e) {
  clearInterval(nextTimer);
  const nx = document.getElementById('next'); if (nx) nx.innerHTML = '';
  current.s = s; current.e = e;
  const si = document.getElementById('s'), ei = document.getElementById('e');
  if (si) si.value = s;
  if (ei) ei.value = e;
  document.getElementById('frame').src = embedUrl('tv', current.id, s, e, 0);
}

async function nextUp() {
  if (!current || current.type !== 'tv') return;
  try {
    const sd = await api(`/tv/${current.id}/season/${current.s}`);
    let s = current.s, e = current.e + 1;
    if (e > sd.episodes.length) { s++; e = 1; if (current.seasons && s > current.seasons) return; }
    showNext(s, e);
  } catch (err) {}
}

function showNext(s, e) {
  const box = document.getElementById('next'); if (!box) return;
  let n = 8;
  clearInterval(nextTimer);
  const paint = () => {
    box.innerHTML = `<div class="nextup"><span>Next up: S${s} E${e}. Playing in ${n}s</span><button id="nplay">Play now</button><button id="ncancel">Cancel</button></div>`;
    document.getElementById('nplay').onclick = () => playEpisode(s, e);
    document.getElementById('ncancel').onclick = () => { clearInterval(nextTimer); box.innerHTML = ''; };
  };
  paint();
  nextTimer = setInterval(() => {
    if (!current || !document.getElementById('next')) return clearInterval(nextTimer);
    if (--n <= 0) return playEpisode(s, e);
    paint();
  }, 1000);
}

// Newest entry first. Add a new entry at the top for every update.

  { v: '16', c: ['Setup Guard Fix: Navigation tabs, search, and title views now check for missing TMDB API key and redirect to setup screen instead of rendering blank.', 'Escape string fix in modal template string.'] },
  { v: '15', c: ['PowerShell Bootstrap & Error Guard: Command template now includes top-level $videoUrl variable and auto-fetches yt-dlp.exe to user folder.', 'Added error handling to PowerShell output explaining 502/403 token expiration with instructions to regrab a fresh link.', 'Modal UI updated with clear troubleshooting section for HTTP errors.'] },
  { v: '14', c: ['Phase 1 & 2 integration: Download modal now generates ready-to-run yt-dlp commands with clean filenames and native HLS flags.', 'Added a built-in yt-dlp installation guide and download link.', 'Added Phase 2 recommendation for 1-click .m3u8 stream sniffing browser extensions (like HLS Downloader).'] },
  { v: '13', c: ['Added a Download button on movie and series pages to generate and copy a ready-to-use yt-dlp command for offline downloading.'] },
  { v: '12', c: ['Theater mode: the ✕ now fades out after 3 seconds. Bring it back by tapping the top-left corner, or swipe back to leave.', 'New “Next ▶” button on series pages and in theater mode.', 'Faster: results are cached for a few minutes, posters start loading on touch, and initial load runs in parallel.'] },
  { v: '11', c: ['Design pass: posters lift slightly on hover, pages fade in smoothly.', 'Title pages now show the runtime (or number of seasons) and genre tags.'] },
  { v: '10', c: ['Patch notes: this screen appears after every update and keeps the history of past versions.'] },
  { v: '9', c: ['Theater mode: the player fills the whole screen while staying in the app, with a ✕ to exit. Made for iPhone.', 'Share this app button at the bottom of My list.'] },
  { v: '8', c: ['Language of titles and descriptions: English, Français, العربية or Español.', 'Share button on each title, with direct links.', 'Rating shown on each poster.', 'TMDB credit line at the bottom.'] },
  { v: '7', c: ['Surprise me: opens a random well-rated title.', 'Sort by Popular, Top rated or Newest.', 'Next up countdown when a series episode ends.', 'Update banner and Check for updates.'] },
  { v: '1 to 6', c: ['Search, trending, player with fullscreen, landscape layout, Movies and Series tabs, Continue watching, My list and history, genre and year filters, similar titles, loading placeholders, keyboard shortcuts, backup and import, install as an app.'] }
];

function showPatchNotes() {
  if (document.getElementById('pnm')) return;
  const m = document.createElement('div');
  m.id = 'pnm'; m.className = 'modal';
  m.innerHTML = '<div class="box" role="dialog" aria-label="Patch notes"><h2 class="sec">What’s new</h2>' +
    PATCHNOTES.map((n, i) => `<div class="pn${i ? ' old' : ''}"><h3>Version ${esc(n.v)}${i ? '' : ' (current)'}</h3><ul>${n.c.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('') +
    '<button id="pnok">Got it</button></div>';
  document.body.appendChild(m);
  const close = () => { m.remove(); try { localStorage.setItem('seen', APP_VERSION); } catch (e) {} };
  document.getElementById('pnok').onclick = close;
  m.onclick = ev => { if (ev.target === m) close(); };
}

async function checkUpdate(manual) {
  const say = t => { const m = document.getElementById('upmsg'); if (m) m.textContent = t; };
  if (location.protocol === 'file:') { if (manual) say('Updates only work on the hosted version.'); return; }
  lastCheck = Date.now();
  try {
    const r = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/APP_VERSION = '(\d+)'/);
    if (m && m[1] !== APP_VERSION) { if (manual) say('New version found.'); return showUpdate(m[1]); }
    if (manual) say('You have the latest version.');
  } catch (e) { if (manual) say('Could not check. Are you online?'); }
}

function showUpdate(v) {
  if (document.getElementById('upd')) return;
  const b = document.createElement('div');
  b.id = 'upd'; b.className = 'upd';
  b.innerHTML = 'A new version of Screenroom is ready. <button id="uprel">Update now</button>';
  document.body.insertBefore(b, document.body.firstChild);
  document.getElementById('uprel').onclick = () => { location.href = location.pathname + '?v=' + v; };
}

async function loadSimilar(type, id) {
  try {
    const d = await api(`/${type}/${id}/recommendations`);
    const l = d.results.filter(i => i.poster_path).slice(0, 8);
    const box = document.getElementById('sim');
    if (!l.length || !box || !current || String(current.id) !== String(id)) return;
    box.innerHTML = '<h2 class="sec">Similar titles</h2><div class="grid sm">' + l.map(i => `<div class="card" tabindex="0" data-type="${type}" data-id="${i.id}">
      <img loading="lazy" decoding="async" src="${IMG}w342${i.poster_path}" alt="${esc(i.title || i.name)}">
      <div>${esc(i.title || i.name)}</div></div>`).join('') + '</div>';
    bindCards();
  } catch (e) {}
}

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); q.focus(); q.select(); }
  else if (e.key === 'Escape') { if (document.body.classList.contains('theater')) exitTheater(); else if (typing) document.activeElement.blur(); else if (current) backBtn.click(); }
  else if (e.key.toLowerCase() === 'f' && !typing) {
    const pl = document.querySelector('.player');
    if (!pl) return;
    if (document.fullscreenElement) document.exitFullscreen(); else if (pl.requestFullscreen) pl.requestFullscreen();
  }
});

document.getElementById('texit').onclick = () => {
  if (document.body.classList.contains('thide')) return showTheaterUI();
  if (history.state && history.state.theater) history.back(); else exitTheater();
};
document.getElementById('tnext').onclick = () => { showTheaterUI(); nextEpisodeNow(); };
window.addEventListener('popstate', () => { if (document.body.classList.contains('theater')) exitTheater(); });
backBtn.onclick = () => { clearInterval(nextTimer); current = null; q.value.trim() ? q.dispatchEvent(new Event('input')) : home(); };
document.getElementById('home').onclick = () => { current = null; tab = 'all'; home(); };
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { current = null; tab = b.dataset.tab; filt = { genre: '', year: '', sort: 'popular' }; home(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastCheck > 600000) checkUpdate(false); });
let seenV = '';
try { seenV = localStorage.getItem('seen') || ''; } catch (e) {}
if (seenV !== APP_VERSION) { if (key) showPatchNotes(); else { try { localStorage.setItem('seen', APP_VERSION); } catch (e) {} } }
checkUpdate(false);
const hm = location.hash.match(/^#(movie|tv)\/(\d+)$/);
if (hm && key) watch(hm[1], hm[2]); else home();
</script>
