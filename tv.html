<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141922">
  <title>Screenroom TV</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #141922; }
    #screenroom { display: block; width: 100%; height: 100%; border: 0; background: #141922; }
    #tv-status {
      position: fixed; right: 18px; bottom: 14px; z-index: 5;
      padding: 6px 10px; border-radius: 8px; color: #ece9e2;
      background: rgba(20,25,34,.78); font: 12px/1.3 system-ui, sans-serif;
      opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    body:focus-within #tv-status { opacity: .55; }
  </style>
</head>
<body>
  <iframe id="screenroom" src="./index.html?tv=1" title="Screenroom TV" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
  <div id="tv-status" aria-hidden="true">Screenroom TV · Arrow keys to navigate · OK to select · Back to return</div>
  <script>
    (function () {
      var frame = document.getElementById('screenroom');

      function installTVMode() {
        var doc, win;
        try {
          doc = frame.contentDocument;
          win = frame.contentWindow;
          if (!doc || !doc.body) return;
        } catch (error) {
          return;
        }

        if (doc.getElementById('screenroom-tv-style')) return;

        var style = doc.createElement('style');
        style.id = 'screenroom-tv-style';
        style.textContent = [
          'html, body { min-height:100%; }',
          'body { font-size:18px; }',
          'header { gap:14px 20px; padding:18px 34px 14px; }',
          'main { max-width:1900px; padding:28px 36px 56px; }',
          '.grid { grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:20px; }',
          '.grid.sm { grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:16px; }',
          '.rail .card { flex-basis:205px; }',
          'button, nav button, .filters select, .filters input { min-height:48px; font-size:18px; padding:10px 18px; }',
          '#q { min-height:48px; font-size:18px; }',
          'nav { gap:10px; }',
          '.card div { font-size:17px; padding:10px 12px; }',
          '.card:focus, .ccard:focus, .epc:focus, .scard:focus, button:focus, a:focus, input:focus, select:focus, textarea:focus, [tabindex="0"]:focus { outline:4px solid var(--accent, #ff7a45) !important; outline-offset:4px; transform:scale(1.035); z-index:4; }',
          '.card, button, .ccard, .epc, .scard, .chip, a, [tabindex="0"] { scroll-margin:100px; }',
          '.arr { opacity:.95; }',
          '@media (max-width:900px) { header { flex-wrap:wrap; } main { padding:20px; } }'
        ].join('\n');
        doc.head.appendChild(style);
        doc.body.classList.add('screenroom-tv');

        function visible(el) {
          if (!el || !el.isConnected || el.disabled) return false;
          var r = el.getBoundingClientRect();
          var s = win.getComputedStyle(el);
          return r.width > 0 && r.height > 0 && s.display !== 'none' &&
            s.visibility !== 'hidden' && Number(s.opacity) !== 0;
        }

        function items() {
          var selector = 'a[href], button, input:not([type="hidden"]), select, textarea, [tabindex="0"], .card, .ccard, .epc, .scard, .chip';
          return Array.prototype.slice.call(doc.querySelectorAll(selector))
            .filter(function (el) { return visible(el) && el.getAttribute('tabindex') !== '-1'; });
        }

        function focusFirst() {
          var list = items();
          if (!list.length) return;
          var active = doc.activeElement;
          if (active === doc.body || active === doc.documentElement || !visible(active)) {
            list[0].focus({ preventScroll: true });
            list[0].scrollIntoView({ block: 'nearest', inline: 'nearest' });
          }
        }

        function moveFocus(key) {
          var list = items();
          var current = doc.activeElement;
          if (!list.length) return;
          if (list.indexOf(current) < 0) {
            focusFirst();
            return;
          }
          var a = current.getBoundingClientRect();
          var ax = a.left + a.width / 2;
          var ay = a.top + a.height / 2;
          var best = null;
          var bestScore = Infinity;

          list.forEach(function (candidate) {
            if (candidate === current) return;
            var r = candidate.getBoundingClientRect();
            var x = r.left + r.width / 2;
            var y = r.top + r.height / 2;
            var dx = x - ax;
            var dy = y - ay;
            var primary, secondary;
            if (key === 'ArrowRight') { if (dx <= 4) return; primary = dx; secondary = Math.abs(dy); }
            if (key === 'ArrowLeft')  { if (dx >= -4) return; primary = -dx; secondary = Math.abs(dy); }
            if (key === 'ArrowDown')  { if (dy <= 4) return; primary = dy; secondary = Math.abs(dx); }
            if (key === 'ArrowUp')    { if (dy >= -4) return; primary = -dy; secondary = Math.abs(dx); }
            var score = primary + secondary * 2.2;
            if (score < bestScore) { bestScore = score; best = candidate; }
          });

          if (best) {
            best.focus({ preventScroll: true });
            best.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'auto' });
          }
        }

        doc.addEventListener('keydown', function (event) {
          var key = event.key;
          var active = doc.activeElement;
          var typing = active && (/^(INPUT|TEXTAREA)$/.test(active.tagName) ||
            (active.isContentEditable));
          if (typing && key !== 'Escape') return;

          if (key === 'ArrowUp' || key === 'ArrowDown' ||
              key === 'ArrowLeft' || key === 'ArrowRight') {
            moveFocus(key);
            event.preventDefault();
            event.stopPropagation();
            return;
          }

          if (key === 'Enter' || key === 'OK' || key === 'Select') {
            if (active && active !== doc.body &&
                !/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(active.tagName)) {
              event.preventDefault();
              active.click();
            }
            return;
          }

          if (key === 'Escape' || key === 'Backspace' || key === 'BrowserBack' ||
              key === 'GoBack' || key === 'XF86Back') {
            var modal = doc.querySelector('.modal, #lightbox');
            if (modal) {
              var close = modal.querySelector('button');
              if (close) close.click();
              else modal.remove();
            } else if (doc.body.classList.contains('theater')) {
              var exit = doc.getElementById('texit');
              if (exit) exit.click();
            } else {
              var back = doc.getElementById('back');
              if (back && win.getComputedStyle(back).display !== 'none') back.click();
              else {
                var home = doc.getElementById('home');
                if (home) home.click();
              }
            }
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        var observer = new win.MutationObserver(function () {
          if (!doc.activeElement || doc.activeElement === doc.body) focusFirst();
        });
        observer.observe(doc.body, { childList: true, subtree: true });
        win.addEventListener('load', focusFirst);
        win.setTimeout(focusFirst, 700);
        win.setTimeout(focusFirst, 1800);
      }

      frame.addEventListener('load', installTVMode);
    })();
  </script>
</body>
</html>
